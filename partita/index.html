    '<div class="tiles">' + tile("r-saveall", ic("folder"), "Salva tutte le rose", "La tua squadra e tutti gli avversari") +
    '<label class="tile" for="r-file"><span class="ti">' + ic("list") + '</span><span class="tlab">Carica rose da file<small>I nomi già presenti non si duplicano</small></span><span class="chev">' + CHEV + "</span></label></div>" +
    '<input type="file" id="r-file" accept=".json,.txt,.csv,application/json,text/plain" hidden>' +
    '<div class="note">Per una sola squadra usa Salva su file nella sua rosa. Un file di testo con un nome per riga va nella rosa aperta.</div>';
}
function rosterEntries(all) {
  var mine = { squadra: S.settings.team || "La mia squadra", mia: true, giocatori: S.settings.roster.slice() };
  if (!all) {
    if (ui.rTab !== "opp") return [mine];
    return [{ squadra: S.oppLabels[ui.rOpp] || ui.rOpp, mia: false, giocatori: S.oppRosters[ui.rOpp].slice() }];
  }
  return [mine].concat(Object.keys(S.oppRosters).sort().map(function (k) {
    return { squadra: S.oppLabels[k] || k, mia: false, giocatori: S.oppRosters[k].slice() };
  }));
}
function fileName(s) { return String(s).replace(/[\\/:*?"<>|]+/g, "").trim() || "rosa"; }
// Nell'app Android scrive il file e apre la condivisione (Salva su Drive, File…); su telefono la
// condivisione di sistema (iPhone: Salva in File); sul PC lo scarica nella cartella Download.
function saveFile(name, text) {
  var C = window.Capacitor;
  if (C && C.isNativePlatform && C.isNativePlatform() && C.nativePromise) {
    C.nativePromise("Filesystem", "writeFile", { path: name, data: text, directory: "CACHE", encoding: "utf8" })
      .then(function (r) { return C.nativePromise("Share", "share", { title: name, url: r.uri, dialogTitle: "Salva il file delle rose" }); })
      .catch(function (err) { if (!/cancel/i.test((err && err.message) || "")) toast("Non è stato possibile salvare il file"); });
    return;
  }
  var file = null;
  try { file = new File([text], name, { type: "application/json" }); } catch (e) {}
  var phone = window.matchMedia && matchMedia("(pointer: coarse)").matches;
  if (file && phone && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).catch(function (err) { if (!err || err.name !== "AbortError") downloadFile(name, text); });
    return;
  }
  downloadFile(name, text);
}
function downloadFile(name, text) {
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("File salvato: " + name);
}
function saveRosters(all) {
  var entries = rosterEntries(all);
  var text = JSON.stringify({ app: "bordocampo", tipo: "rose", salvato: new Date().toISOString(), rose: entries }, null, 2);
  saveFile(fileName(all ? "Bordocampo rose " + new Date().toISOString().slice(0, 10) : "Rosa " + entries[0].squadra) + ".json", text);
}
// Carica un file: le rose del JSON vanno nella mia rosa (mia: true) o in quella dell'avversario
// con lo stesso nome; un file di testo va nella rosa aperta. I nomi già presenti non si duplicano.
function loadRosters(text, fname) {
  var data = null, entries;
  try { data = JSON.parse(text); } catch (e) {}
  if (data && Array.isArray(data.rose)) entries = data.rose;
  else if (data && Array.isArray(data.giocatori)) entries = [data];
  else {
    var opp = ui.rTab === "opp";
    var label = opp ? (ui.rOpp ? S.oppLabels[ui.rOpp] || ui.rOpp : String(fname || "").replace(/\.[^.]+$/, "").replace(/^rosa\s+/i, "")) : S.settings.team;
    entries = [{ squadra: label, mia: !opp, giocatori: splitNames(text) }];
  }
  var done = [];
  entries.forEach(function (r) {
    var label = String((r && r.squadra) || "").trim(), list;
    var names = ((r && r.giocatori) || []).map(function (x) { return String(x).trim(); }).filter(Boolean);
    if (r && r.mia) {
      list = S.settings.roster;
      if (!S.settings.team && label) S.settings.team = label;
      label = label || S.settings.team || "La mia squadra";
    } else {
      if (!label) return;
      var k = label.toLowerCase();
      if (!S.oppRosters[k]) S.oppRosters[k] = [];
      if (!S.oppLabels[k]) S.oppLabels[k] = label;
      list = S.oppRosters[k];
    }
    var n = 0;
    names.forEach(function (p) { if (list.indexOf(p) < 0) { list.push(p); n++; } });
    done.push(label + " +" + n);
  });
  save(); render();
  toast(done.length ? "Rose caricate: " + done.join(", ") : "Nel file non ci sono rose da caricare", 3500);
}
function rosterList() { return ui.rTab === "opp" ? (ui.rOpp && S.oppRosters[ui.rOpp]) : S.settings.roster; }
// Rosa: un menu con La mia squadra / Avversari / Salva e carica, ognuna nella sua schermata.
function vRoster() {
  var sec = ui.p.sec, h;
  if (!sec) {
    var opps = Object.keys(S.oppRosters).length;
    return topBar("Rosa") + '<div class="tiles">' +
      tile("r-go", ic("shirt"), esc(S.settings.team || "La mia squadra"), S.settings.roster.length + " giocatori", ' data-v="mine"') +
      tile("r-go", ic("opp"), "Avversari", opps ? opps + " squadre" : "Nessuna squadra salvata", ' data-v="opps"') +
      tile("r-go", ic("folder"), "Salva e carica", "Rose in un file, anche per un altro dispositivo", ' data-v="file"') + "</div>";
  }
  if (sec === "file") {
    ui.rTab = null;
    return topBar("Salva e carica") + filePanel(null);
  }
  if (sec === "opps") {
    var keys = Object.keys(S.oppRosters).sort();
    h = topBar("Avversari") + '<div class="tiles compact">' + keys.map(function (k) {
      return tile("r-opp", ic("opp"), esc(S.oppLabels[k] || k), S.oppRosters[k].length + " giocatori", ' data-v="' + esc(k) + '"');
    }).join("") + "</div>";
    if (!keys.length) h += '<div class="note">Nessuna squadra avversaria salvata.</div>';
    return h + '<section class="panel"><h2>Nuova squadra avversaria</h2>' +
      '<div class="row"><input type="text" id="r-oppname" class="grow" autocomplete="off" placeholder="Nome, es. Virtus"><button class="btn primary" data-a="r-oppnew">Crea</button></div>' +
      '<div class="note">La rosa di un avversario viene proposta in automatico quando giochi contro una squadra con lo stesso nome.</div></section>';
  }
  // rosa di una squadra: la mia (sec "mine") o un avversario (sec "opp", ui.rOpp)
  ui.rTab = sec === "opp" ? "opp" : "mine";
  var r = rosterList();
  if (!r) { ui.p = { sec: "opps" }; return vRoster(); }
  h = topBar(sec === "opp" ? "Avversario" : "La mia squadra");
  if (sec === "mine") h += '<section class="panel"><label class="f">Nome della squadra<input type="text" id="r-team" autocomplete="off" value="' + esc(S.settings.team) + '" placeholder="La mia squadra"></label></section>';
  else h += '<p class="lead">' + esc(S.oppLabels[ui.rOpp] || ui.rOpp) + "</p>";
  h += '<section class="panel"><h2>Aggiungi giocatori</h2><div class="row"><input type="text" id="r-new" class="grow" autocomplete="off" placeholder="Es. 10 Rossi"><button class="btn primary" data-a="r-add">Aggiungi</button></div>' +
    '<div class="note">Anche tanti insieme, separati da virgola. Il numero di maglia prima del nome compare sul campo.</div></section>' +
    '<section class="panel"><h2>' + r.length + " giocatori</h2>";
  if (!r.length) h += '<div class="empty">La rosa è vuota.</div>';
  else {
    h += '<div class="list">';
    r.forEach(function (p, i) { h += '<div class="item"><span class="grow t">' + esc(p) + '</span><button class="link danger" data-a="r-del" data-i="' + i + '" aria-label="Rimuovi ' + esc(p) + '">Rimuovi</button></div>'; });
    h += "</div>";
  }
  return h + "</section>" + '<div class="controls"><button class="btn ghost" data-a="r-save"' + (r.length ? "" : " disabled") + ">Salva su file</button>" +
    '<label class="btn ghost" for="r-file">Carica da file</label></div><input type="file" id="r-file" accept=".json,.txt,.csv,application/json,text/plain" hidden>';
}

function timeline(m) {
  var list = sorted(m);
  if (!list.length) return '<div class="empty">Ancora nessun evento. Gol, cartellini e cambi compaiono qui con il loro minuto.</div>';
  var h = "", cur = 0;
  list.forEach(function (e) {
    if (e.period !== cur) {
      cur = e.period;
      if (m.periods > 1) h += '<div class="tl-period"><span>' + periodName(cur) + "</span></div>";
    }
    var side = '<span class="side' + (e.team === "away" ? " r" : "") + '">' + evIcon(m, e) + evText(m, e) + "</span>";
    h += '<button class="ev" data-a="edit" data-mid="' + m.id + '" data-id="' + e.id + '">' +
      (e.team === "home" ? side : "<span></span>") +
      '<span class="min">' + minuteLabel(m, e.period, e.sec) + "</span>" +
      (e.team === "away" ? side : "<span></span>") + "</button>";
  });
  return h;
}
function cronacaHTML(m) {
  var h = '<section class="panel"><div class="note">Tocca un evento per correggere giocatori, tipo, minuto o squadra.</div><div class="tl">' + timeline(m) + "</div></section>";
  var y = cardsOf(m, "yellow"), r = cardsOf(m, "red"), subs = subsOf(m);
  var block = function (title, list, icon) {
    return list.length ? "<h2>" + title + '</h2><div class="list">' + list.map(function (s) { return '<div class="item"><span class="ico">' + icon + '</span><span class="grow">' + esc(s) + "</span></div>"; }).join("") + "</div>" : "";
  };
  if (y.length || r.length || subs.length) h += '<section class="panel">' + block("Ammoniti", y, '<i class="card y"></i>') + block("Espulsi", r, '<i class="card r"></i>') + block("Cambi", subs, subSVG()) + "</section>";
  return h;
}
// Scelta della squadra a tutto schermo: due schede grandi.
function teamPickHTML(m, title, sub) {
  return topBar(title) + '<p class="lead">Per quale squadra?' + (sub ? "<small>" + sub + "</small>" : "") + '</p><div class="tiles">' +
    ["home", "away"].map(function (t) {
      return tile("tp", ic(t === m.mySide ? "shirt" : "opp"), esc(teamName(m, t)), (t === m.mySide ? "La mia squadra · " : "") + score(m, t) + " gol", ' data-t="' + t + '"', false, "big");
    }).join("") + "</div>";
}

function vLive() {
  var m = S.match, brk = m.status === "break", last = m.period >= m.periods, can = m.status === "play", sec = ui.p.sec;
  if (sec === "team") {
    var what = { goal: ["Gol", "Il minuto si registra subito, poi scegli il marcatore."], card: ["Ammonizioni", "Poi scegli il cartellino."],
      sub: ["Sostituzioni", "Poi scegli chi esce e chi entra."], lineup: ["Formazione", ""] }[ui.p.act];
    return teamPickHTML(m, what[0], what[1]);
  }
  if (sec === "cardtype") {
    return topBar("Ammonizioni") + '<p class="lead">' + esc(teamName(m, ui.p.t)) + "<small>Che cartellino?</small></p>" +
      '<div class="tiles">' + tile("ct", ic("yellow"), "Ammonizione", "Cartellino giallo", ' data-c="yellow"') +
      tile("ct", ic("red"), "Espulsione", "Cartellino rosso", ' data-c="red"') + "</div>";
  }
  if (sec === "lineup") return topBar("Formazione") + '<p class="lead">' + esc(teamName(m, ui.p.t)) + "</p>" + teamLineupHTML(m, ui.p.t);
  if (sec === "cronaca") return topBar("Cronaca") + cronacaHTML(m);
  if (sec === "diretta") return topBar("Diretta") + livePanel(m);
  if (sec === "tempo") {
    return topBar("Cronometro") + '<section class="board"><div class="clockwrap"><div class="clock"><span id="clk">00:00</span><span class="extra" id="extra"></span></div>' +
      '<div class="cd" id="cdw">Mancano <b id="cd">00:00</b></div></div></section>' +
      '<section class="panel"><h2>Correggi il cronometro</h2><div class="adj">' +
      '<button data-a="adj" data-d="-60">−1′</button><button data-a="adj" data-d="-10">−10″</button>' +
      '<button data-a="adj" data-d="10">+10″</button><button data-a="adj" data-d="60">+1′</button></div>' +
      '<div class="note">Se hai avviato in ritardo o in anticipo, sposta il tempo di gioco.</div></section>' +
      '<section class="panel"><h2>Partita</h2><div class="note">' + m.periods + " tempi da " + m.minutes + "′. Termina adesso se la partita finisce prima del tempo.</div>" +
      '<button class="btn danger block" data-a="end-match">Termina la partita</button></section>';
  }
  // schermata principale della partita
  var side = function (t) {
    var ball = '<button class="ball" data-a="goal" data-t="' + t + '" aria-label="Gol ' + esc(teamName(m, t)) + '"' + (can ? "" : " disabled") + ">" + ballSVG() + "</button>";
    var nm = '<span class="tname">' + (t === m.mySide ? '<span class="mine">noi</span>' : "") + esc(teamName(m, t)) + "</span>";
    return '<div class="side"><div class="nm">' + (t === "home" ? ball + nm : nm + ball) + '</div><div class="score">' + score(m, t) + "</div></div>";
  };
  var h = '<div class="top"><button class="link" data-a="back">‹ Home</button><span class="title">' + (brk ? "Intervallo" : periodName(m.period)) + "</span><span></span></div>";
  h += '<section class="board hub">' +
    '<div class="board-top"><span>' + m.periods + " × " + m.minutes + '′</span><span class="pill" id="pill"><i class="dot"></i><span id="pill-t"></span></span></div>' +
    '<div class="clockwrap"><div class="clock"><span id="clk">00:00</span><span class="extra" id="extra"></span></div>' +
    '<div class="cd" id="cdw">Mancano <b id="cd">00:00</b></div></div>' +
    '<div class="scoreline">' + side("home") + '<div class="vs">-</div>' + side("away") + "</div></section>";
  if (brk) h += '<button class="btn primary big block" data-a="next-period">Inizia il ' + periodName(m.period + 1) + "</button>";
  else h += '<div class="controls"><button class="btn primary big" id="toggle" data-a="toggle"></button>' +
    '<button class="btn big" data-a="end-period">' + (last ? "Fine partita" : "Fine " + m.period + "° t.") + "</button></div>";
  h += '<div class="tiles compact">' +
    tile("hub", ic("formation"), "Formazione", "", ' data-v="lineup"') +
    tile("hub", ic("ball"), "Gol", "", ' data-v="goal"', !can) +
    tile("hub", ic("yellow"), "Ammonizioni", "", ' data-v="card"', !can) +
    tile("hub", ic("sub"), "Sostituzioni", "", ' data-v="sub"', !can) + "</div>";
  h += '<div class="tiles small">' + tile("hub", ic("list"), "Cronaca", "", ' data-v="cronaca"') +
    tile("hub", ic("live"), "Diretta", "", ' data-v="diretta"') + tile("hub", ic("clock"), "Cronometro", "", ' data-v="tempo"') + "</div>";
  return h;
}

// Editor della formazione: modulo, poi tocchi un ruolo e scegli il giocatore; sotto, chi va in panchina.
// Chi è in campo sparisce dagli elenchi; tolto dal campo torna in panchina.
function vLineup() {
  var m = findMatch(ui.lmid), t = ui.luTeam;
  var L = m && lineupOf(m, t);
  if (!L) { ui.view = "home"; ui.stack = []; return vHome(); }
  var size = modSize(L.mod), sel = ui.luSlot, roster = playersOf(m, t), bench = benchOf(m, t, L);
  var out = roster.filter(function (p) { return L.slots.indexOf(p) < 0 && bench.indexOf(p) < 0; });
  var chip = function (p, act, extra) { return '<button class="chip' + (extra || "") + '" data-a="' + act + '" data-v="' + esc(p) + '">' + esc(p) + "</button>"; };
  var h = topBar("Formazione") + '<p class="lead">' + esc(teamName(m, t)) + "</p>";
  h += '<section class="panel"><h2>Giocatori in campo</h2><div class="seg">' + Object.keys(MODULI).map(function (n) {
    return '<button data-a="lu-size" data-v="' + n + '" aria-pressed="' + (+n === size) + '">' + n + "</button>";
  }).join("") + '</div><div class="chips">' + (MODULI[size] || [L.mod]).map(function (mod) {
    return '<button class="chip" data-a="lu-mod" data-v="' + mod + '" aria-pressed="' + (mod === L.mod) + '">' + mod + "</button>";
  }).join("") + "</div></section>";
  h += pitchHTML(L.mod, L.slots, null, { edit: true, sel: sel });
  if (sel != null) {
    h += '<section class="panel"><h2>' + roleOf(L.mod, sel) + (L.slots[sel] ? ": " + esc(L.slots[sel]) : "") + "</h2>" +
      chooserHTML({ key: "lu", input: "lu-q", q: ui.luQ, groups: [["Panchina", bench], ["Non convocati", out]], act: "lu-pick", attrs: "",
        cur: "", add: "lu-add", team: teamName(m, t) }) +
      (roster.length ? "" : '<div class="note">La rosa è vuota: scrivi i nomi qui sotto, separati da virgola.</div>') +
      '<div class="controls">' + (L.slots[sel] ? '<button class="btn danger" data-a="lu-clear">Togli dal campo</button>' : "<span></span>") +
      '<button class="btn" data-a="lu-slot" data-i="' + sel + '">Chiudi</button></div></section>';
  } else {
    h += '<div class="note">Tocca un ruolo sul campo per scegliere il giocatore.</div>';
  }
  h += '<section class="panel"><h2>Panchina \u00b7 ' + bench.length + "</h2>" +
    (bench.length ? '<div class="chips">' + bench.map(function (p) { return chip(p, "lu-bench", " on"); }).join("") + "</div>" : '<div class="empty">Nessun giocatore in panchina.</div>') +
    "<h2>Altri della rosa \u00b7 non convocati</h2>" +
    (out.length ? '<div class="chips">' + out.map(function (p) { return chip(p, "lu-bench"); }).join("") + "</div>" : '<div class="empty">Tutta la rosa è in campo o in panchina.</div>') +
    '<div class="note">Tocca un nome per spostarlo tra panchina e non convocati.</div>' +
    '<div class="row"><input type="text" id="lu-new" class="grow" autocomplete="off" placeholder="Nuovi giocatori, separati da virgola">' +
    '<button class="btn" data-a="lu-many">Aggiungi</button></div></section>';
  return h + '<button class="btn primary big block" data-a="lu-done">Fatto</button>';
}

function vSummary() {
  var m = findMatch(ui.id);
  if (!m) { ui.view = "home"; ui.stack = []; return vHome(); }
  var sec = ui.p.sec;
  if (sec === "cronaca") return topBar("Cronaca") + cronacaHTML(m);
  if (sec === "diretta") return topBar("Diretta") + livePanel(m);
  if (sec === "team") return teamPickHTML(m, ui.p.act === "fix" ? "Correggi" : "Formazione", ui.p.act === "fix" ? "Poi scegli cosa aggiungere." : "");
  if (sec === "lineup") return topBar("Formazione") + '<p class="lead">' + esc(teamName(m, ui.p.t)) + "</p>" + teamLineupHTML(m, ui.p.t);
  if (sec === "fixtype") {
    var t = ui.p.t;
    return topBar("Correggi") + '<p class="lead">' + esc(teamName(m, t)) + "<small>Cosa vuoi aggiungere?</small></p>" +
      '<div class="tiles compact">' + tile("past-add", ic("ball"), "Gol", "", ' data-c="goal" data-t="' + t + '"') +
      tile("past-add", ic("yellow"), "Ammonizione", "", ' data-c="yellow" data-t="' + t + '"') +
      tile("past-add", ic("red"), "Espulsione", "", ' data-c="red" data-t="' + t + '"') +
      tile("past-add", ic("sub"), "Cambio", "", ' data-c="sub" data-t="' + t + '"') + "</div>" +
      '<div class="note">Per togliere o spostare un evento sull’altra squadra, aprilo dalla Cronaca.</div>';
  }
  var sh = scorersOf(m, "home"), sa = scorersOf(m, "away");
  var h = topBar("Finale");
  h += '<section class="board final"><div class="board-top"><span>' + esc(dateLabel(m.date)) + '</span><span class="tabnum">' + m.periods + " × " + m.minutes + "′</span></div>" +
    '<div class="scoreline"><span class="tname">' + esc(m.home) + '</span><span class="score">' + score(m, "home") + " - " + score(m, "away") + '</span><span class="tname">' + esc(m.away) + "</span></div>" +
    (m.periods > 1 ? '<div class="partials">' + partials(m).join(" · ") + "</div>" : "") +
    ((sh.length || sa.length) ? '<div class="scorers"><div>' + sh.map(function (s) { return "<p>" + esc(s) + "</p>"; }).join("") + '</div><div class="r">' + sa.map(function (s) { return "<p>" + esc(s) + "</p>"; }).join("") + "</div></div>" : "") +
    "</section>";
  h += '<div class="tiles compact">' +
    tile("s-go", ic("list"), "Cronaca", sorted(m).length + " eventi", ' data-v="cronaca"') +
    tile("s-go", ic("formation"), "Formazioni", "", ' data-v="lineup"') +
    tile("s-go", ic("pen"), "Correggi il risultato", "Aggiungi un evento dimenticato", ' data-v="fix"') +
    tile("share", ic("share"), "Condividi il risultato", "Marcatori, minuti e cartellini") +
    (m.live ? tile("s-go", ic("live"), "Diretta", "Link per i genitori", ' data-v="diretta"') : "") + "</div>";
  return h + '<button class="danger-link" data-a="del-match">Elimina partita</button>';
}

/* ---------- foglio evento e conferme ---------- */
function renderLayer() {
  var h = "";
  if (ui.sheet) {
    var m = findMatch(ui.sheet.mid), e = m && m.events.filter(function (x) { return x.id === ui.sheet.eid; })[0];
    if (!e) ui.sheet = null;
    else h += sheetHTML(m, e);
  }
  if (ui.confirm) {
    h += '<div class="scrim" data-a="c-no"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' +
      '<div class="sh-head"><h3>' + esc(ui.confirm.title) + "</h3></div>" +
      (ui.confirm.text ? '<div class="note">' + esc(ui.confirm.text) + "</div>" : "") +
      '<div class="sh-foot"><button class="btn" data-a="c-no">Annulla</button><button class="btn ' + (ui.confirm.danger ? "danger" : "primary") + '" data-a="c-yes">' + esc(ui.confirm.ok) + "</button></div></div>";
  }
  if (ui.share) {
    h += '<div class="scrim" data-a="share-close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' +
      '<div class="sh-head"><h3>Risultato</h3></div><div class="note">Il testo è selezionato: copialo e incollalo dove vuoi.</div>' +
      '<textarea class="textout" id="share-text" readonly>' + esc(ui.share) + "</textarea>" +
      '<button class="btn primary block" data-a="share-close">Chiudi</button></div>';
  }
  layer.innerHTML = h;
  filterAll();
  var ta = document.getElementById("share-text");
  if (ta) { ta.focus(); ta.select(); }
}

// Elenco per scegliere un giocatore: i nomi della rosa sono tutti visibili, divisi in gruppi
// (es. Panchina / Altri della rosa); la ricerca li filtra. Un nome nuovo si aggiunge alla rosa
// solo col pulsante esplicito, che compare quando il nome cercato non è in elenco.
// o: { key, input, q, groups: [[titolo, nomi]], act, attrs, cur, none, add, team }
function chooserHTML(o) {
  var seen = {}, chip = function (p) {
    seen[p] = 1;
    return '<button class="chip" data-a="' + o.act + '"' + o.attrs + ' data-v="' + esc(p) + '" aria-pressed="' + (o.cur === p) + '">' + esc(p) + "</button>";
  };
  var h = '<div class="pick" data-picker="' + o.key + '" data-input="' + o.input + '">' +
    '<input type="text" id="' + o.input + '" autocomplete="off" placeholder="Cerca nella rosa di ' + esc(o.team) + '" value="' + esc(o.q || "") + '">';
  if (o.none) h += '<div class="chips"><button class="chip" data-a="' + o.act + '"' + o.attrs + ' data-v="" aria-pressed="' + (!o.cur) + '">Non indicato</button></div>';
  o.groups.forEach(function (g) {
    var names = g[1].filter(function (p) { return p && !seen[p]; });
    if (names.length) h += '<div class="grp"><h4>' + g[0] + '</h4><div class="chips">' + names.map(chip).join("") + "</div></div>";
  });
  if (o.cur && !seen[o.cur]) h += '<div class="grp"><h4>Scelto</h4><div class="chips">' + chip(o.cur) + "</div></div>";
  return h + '<button class="btn add" data-a="' + o.add + '"' + o.attrs + " hidden></button></div>";
}
function pickerHTML(m, e, field, label, groups, team) {
  var roster = playersOf(m, team), h = "<h2>" + label + "</h2>";
  if (!roster.length) {
    h += '<div class="note">La rosa di ' + esc(teamName(m, team)) + " è vuota.</div>" +
      '<button class="btn" data-a="roster-open" data-t="' + team + '">Inserisci la rosa di ' + esc(teamName(m, team)) + "</button>";
  }
  return h + chooserHTML({ key: field, input: "new-" + field, q: ui.newPlayer[field], groups: groups, act: "pick", attrs: ' data-f="' + field + '"',
    cur: e[field] || "", none: true, add: "pick-new", team: teamName(m, team) });
}
// Filtra i nomi col testo cercato e mostra "Aggiungi … alla rosa" se il nome non c'è.
function filterChips(key, q) {
  var box = document.querySelector('[data-picker="' + key + '"]');
  if (!box) return;
  var raw = (q || "").trim(), lq = raw.toLowerCase(), exact = false;
  Array.prototype.forEach.call(box.querySelectorAll(".grp .chip[data-v]"), function (c) {
    var v = c.getAttribute("data-v").toLowerCase();
    c.hidden = !!lq && v.indexOf(lq) < 0;
    if (v === lq) exact = true;
  });
  Array.prototype.forEach.call(box.querySelectorAll(".grp"), function (g) { g.hidden = !g.querySelector(".chip:not([hidden])"); });
  var add = box.querySelector(".add");
  if (add) { add.hidden = !raw || exact; add.textContent = "Aggiungi \u00ab" + raw + "\u00bb alla rosa"; }
}
function filterAll() {
  Array.prototype.forEach.call(document.querySelectorAll("[data-picker]"), function (box) {
    var inp = document.getElementById(box.getAttribute("data-input"));
    filterChips(box.getAttribute("data-picker"), inp ? inp.value : "");
  });
}
function sheetHTML(m, e) {
  var pt = playerTeam(e), names = playersOf(m, pt);
  var title = e.type === "goal" ? "Gol " + teamName(m, e.team) : e.type === "red" ? "Espulsione" : e.type === "sub" ? "Cambio" : "Ammonizione";
  var icon = e.type === "goal" ? '<span class="ico" style="width:32px;height:32px">' + ballSVG("inline") + "</span>"
    : e.type === "sub" ? '<span class="ico" style="width:32px;height:32px">' + subSVG() + "</span>"
    : '<span class="ico"><i class="card ' + (e.type === "red" ? "r" : "y") + '" style="width:20px;height:28px"></i></span>';
  var h = '<div class="scrim" data-a="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="grab"></div>' +
    '<div class="sh-head">' + icon + "<h3>" + esc(title) + '</h3><span class="bigmin">' + minuteLabel(m, e.period, e.sec) + "</span></div>";
  if (e.type === "goal") {
    h += '<div class="seg">' + [["azione", "Su azione"], ["rigore", "Rigore"], ["autogol", "Autogol"]].map(function (k) {
      return '<button data-a="kind" data-v="' + k[0] + '" aria-pressed="' + (e.kind === k[0]) + '">' + k[1] + "</button>";
    }).join("") + "</div>";
  } else {
    h += '<div class="note">' + esc(teamName(m, e.team)) + "</div>";
  }
  // Con la formazione della squadra si tocca il giocatore sul campo (com'era al momento dell'evento);
  // sotto, sempre i nomi della rosa.
  var fs = hasLineup(m, pt) ? fieldState(m, e, pt) : null;
  var but = function (list) { var x = [].slice.call(arguments, 1); return list.filter(function (p) { return x.indexOf(p) < 0; }); };
  if (e.type === "sub") {
    if (fs) {
      var onField = fs.slots.filter(Boolean), rest = but.apply(null, [names].concat(onField, fs.bench));
      h += "<h2>Esce \u00b7 tocca il giocatore in campo</h2>" + pitchHTML(fs.mod, fs.slots, fs.stats, { mini: true, pick: "off", cur: e.off });
      h += pickerHTML(m, e, "off", "Oppure scegli chi esce", [["In campo", but(onField, e.on)], ["Panchina", but(fs.bench, e.on)], ["Altri della rosa", but(rest, e.on)]], pt);
      h += pickerHTML(m, e, "on", "Entra", [["Panchina", but(fs.bench, e.off)], ["Altri della rosa", but(rest, e.off)]], pt);
    } else {
      h += pickerHTML(m, e, "off", "Esce", [["Rosa", but(names, e.on)]], pt);
      h += pickerHTML(m, e, "on", "Entra", [["Rosa", but(names, e.off)]], pt);
    }
  } else {
    var label = e.kind === "autogol" ? "Autore dell'autogol (" + esc(teamName(m, pt)) + ")" : "Giocatore" + (e.type === "goal" ? " che ha segnato" : "");
    if (fs) {
      var off = fs.slots.filter(Boolean);
      h += "<h2>" + label + " \u00b7 tocca in campo</h2>" + pitchHTML(fs.mod, fs.slots, fs.stats, { mini: true, pick: "player", cur: e.player });
      h += pickerHTML(m, e, "player", "Oppure scegli dall'elenco", [["In campo", off], ["Panchina", fs.bench], ["Altri della rosa", names]], pt);
    } else {
      h += pickerHTML(m, e, "player", label, [["Rosa", names]], pt);
    }
  }
  h += '<div class="row" style="justify-content:space-between"><label class="muted small" for="ev-minute">Minuto</label><div class="stepper">' +
    '<button data-a="ev-min" data-d="-60" aria-label="Un minuto prima">−</button>' +
    '<input type="text" id="ev-minute" class="v tabnum minute" inputmode="numeric" autocomplete="off" value="' + minuteLabel(m, e.period, e.sec).replace("\u2032", "") + '" aria-label="Minuto, es. 38 o 45+2">' +
    '<button data-a="ev-min" data-d="60" aria-label="Un minuto dopo">+</button></div></div>';
  h += '<button class="btn" data-a="ev-team">Assegna a ' + esc(teamName(m, other(e.team))) + "</button>";
  h += '<div class="sh-foot"><button class="btn danger" data-a="ev-del">Elimina</button><button class="btn primary" data-a="sheet-close">' + (ui.sheet.fresh ? "Fatto" : "Salva") + "</button></div></div>";
  return h;
}

function ask(title, text, ok, fn, danger) { ui.confirm = { title: title, text: text, ok: ok, fn: fn, danger: danger }; renderLayer(); }
function toast(msg, ms) {
  var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, ms || 1800);
}

/* ---------- schermo acceso e segnale di fine tempo ---------- */
var wake = null, actx = null, beeped = false;
function holdWake() { try { if (navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(function (w) { wake = w; w.addEventListener("release", function () { wake = null; }); }).catch(function () {}); } catch (e) {} }
function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {} }
function whistle() {
  try {
    if (!actx) return;
    [0, .35, .7].forEach(function (d) {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.value = 2400;
      g.gain.setValueAtTime(.0001, actx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(.18, actx.currentTime + d + .02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d + .28);
      o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + .3);
    });
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
}

/* ---------- cronometro ---------- */
function tick() {
  var m = S.match;
  if (!m) return;
  var sec = periodSec(m), len = lenSec(m), base = (m.period - 1) * len;
  if (m.run && sec >= len && !m.beeped) { m.beeped = true; save(); whistle(); }
  if (ui.view !== "live") return;
  var $id = function (id) { return document.getElementById(id); };
  if ($id("clk")) {
    $id("clk").textContent = mmss(base + Math.min(sec, len));
    $id("extra").textContent = sec > len ? "+" + mmss(sec - len) : "";
    $id("cd").textContent = mmss(len - sec);
    $id("cdw").className = "cd" + (sec >= len ? " over" : "");
  }
  var pill = $id("pill"), pt = $id("pill-t");
  if (pill) {
    if (m.status === "break") { pill.className = "pill"; pt.textContent = "Intervallo"; }
    else if (m.run) { pill.className = "pill " + (sec >= len ? "over" : "on"); pt.textContent = sec >= len ? "Recupero" : "In corso"; }
    else { pill.className = "pill"; pt.textContent = m.started ? "In pausa" : "Pronti"; }
  }
  var tg = $id("toggle");
  if (tg) tg.textContent = m.run ? "❚❚ Pausa" : m.started ? "▶ Riprendi" : "▶ Avvia";
}
setInterval(tick, 250);
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") { tick(); if (S.match && S.match.run) holdWake(); if (liveTarget()) livePush(); }
});

/* ---------- azioni ---------- */
// Modifiche alla formazione aperta nell'editor (ui.lmid, ui.luTeam).
function lineupAction(a, el) {
  var m = findMatch(ui.lmid), t = ui.luTeam, L = lineupOf(m, t), v = el.getAttribute("data-v");
  var roster = playersOf(m, t), toBench = function (n) { if (n && L.bench.indexOf(n) < 0) L.bench.push(n); };
  var fromBench = function (n) { L.bench = L.bench.filter(function (x) { return x !== n; }); };
  if (a === "lu-slot") { var si = +el.getAttribute("data-i"); ui.luSlot = ui.luSlot === si ? null : si; ui.luQ = ""; render(); return; }
  if (a === "lu-size" || a === "lu-mod") {
    L.mod = a === "lu-size" ? MODULI[v][0] : v;
    L.slots.slice(modSize(L.mod)).forEach(toBench);  // chi non ci sta più torna in panchina
    L.slots = fitSlots(L.slots, modSize(L.mod));
    if (ui.luSlot != null && ui.luSlot >= L.slots.length) ui.luSlot = null;
  }
  if (a === "lu-add") {
    v = (document.getElementById("lu-q").value || "").trim();  // solo dal pulsante "Aggiungi … alla rosa"
    if (!v) { document.getElementById("lu-q").focus(); return; }
    addToRoster(roster, v);
  }
  if (a === "lu-pick" || a === "lu-add") {
    if (ui.luSlot == null) ui.luSlot = L.slots.indexOf("");
    if (ui.luSlot < 0) { ui.luSlot = null; toast("Tocca prima un ruolo sul campo"); return; }
    toBench(L.slots[ui.luSlot]);  // chi c'era torna in panchina
    fromBench(v);
    L.slots[ui.luSlot] = v;
    var next = L.slots.indexOf("");
    ui.luSlot = next >= 0 ? next : null; ui.luQ = "";
  }
  if (a === "lu-clear") { toBench(L.slots[ui.luSlot]); L.slots[ui.luSlot] = ""; }
  if (a === "lu-bench") { if (L.bench.indexOf(v) >= 0) fromBench(v); else toBench(v); }
  if (a === "lu-many") {
    var inp = document.getElementById("lu-new");
    splitNames(inp.value).forEach(function (n) { addToRoster(roster, n); if (L.slots.indexOf(n) < 0) toBench(n); });
  }
  rememberLineup(m, t); save(); render();
  if (a === "lu-many") { var again = document.getElementById("lu-new"); if (again) again.focus(); }
}
function readForm() {
  var a = document.getElementById("f-team"), b = document.getElementById("f-opp");
  if (a) form.team = a.value;
  if (b) form.opp = b.value;
}
function splitNames(s) { return s.split(/[,;\n]+/).map(function (x) { return x.trim(); }).filter(Boolean); }
function addToRoster(list, name) { if (list.indexOf(name) < 0) list.push(name); }

document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-a]");
  if (!el || el.disabled) return;
  var a = el.getAttribute("data-a"), m = S.match;
  var sm = ui.sheet && findMatch(ui.sheet.mid);
  var se = sm && sm.events.filter(function (x) { return x.id === ui.sheet.eid; })[0];

  switch (a) {
    case "back": back(); break;
    case "home": reset("home"); break;
    case "setup": form = null; go("setup", { step: 1 }); break;
    case "resume": go("live"); break;
    case "roster": go("roster"); break;
    case "history": go("history"); break;
    case "r-go": go("roster", { sec: el.getAttribute("data-v") }); break;
    case "roster-open": {
      // dal foglio di un evento: apre la rosa di quella squadra; Indietro riporta all'evento
      var rm = findMatch(ui.sheet.mid), rt = el.getAttribute("data-t"), mineT = rt === rm.mySide;
      if (!mineT) { playersOf(rm, rt); ui.rOpp = oppKey(rm); }
      go("roster", { sec: mineT ? "mine" : "opp" }); break;
    }
    case "r-opp": ui.rOpp = el.getAttribute("data-v"); go("roster", { sec: "opp" }); break;
    case "r-oppnew": {
      var on = document.getElementById("r-oppname").value.trim();
      if (!on) { document.getElementById("r-oppname").focus(); break; }
      var ok = on.toLowerCase();
      if (!S.oppRosters[ok]) S.oppRosters[ok] = [];
      S.oppLabels[ok] = on; ui.rOpp = ok; save(); go("roster", { sec: "opp" });
      var rn = document.getElementById("r-new"); if (rn) rn.focus();
      break;
    }
    case "open": ui.id = el.getAttribute("data-id"); go("summary"); break;
    case "s-go": {
      var sv = el.getAttribute("data-v");
      go("summary", sv === "lineup" || sv === "fix" ? { sec: "team", act: sv } : { sec: sv }); break;
    }
    case "hub": {
      var hv = el.getAttribute("data-v");
      go("live", /^(goal|card|sub|lineup)$/.test(hv) ? { sec: "team", act: hv } : { sec: hv }); break;
    }
    case "tp": {
      // squadra scelta: gol e cambi si registrano subito e si torna alla partita
      var tt = el.getAttribute("data-t"), act = ui.p.act;
      if (act === "fix") { go("summary", { sec: "fixtype", t: tt }); break; }
      if (act === "lineup") { go(ui.view, { sec: "lineup", t: tt }); break; }
      if (act === "card") { go("live", { sec: "cardtype", t: tt }); break; }
      unlockAudio(); reset("live", {}, [{ view: "home", p: {} }]); addEvent(act, tt); break;
    }
    case "ct": { var ctt = ui.p.t; reset("live", {}, [{ view: "home", p: {} }]); addEvent(el.getAttribute("data-c"), ctt); break; }
    case "f-next": readForm(); go("setup", { step: 2 }); break;
    case "f-side": readForm(); form.side = el.getAttribute("data-v"); render(); break;
    case "f-per": readForm(); form.periods = Math.min(8, Math.max(1, form.periods + +el.getAttribute("data-d"))); render(); break;
    case "f-min": readForm(); form.minutes = Math.min(90, Math.max(1, form.minutes + +el.getAttribute("data-d"))); render(); break;
    case "f-preset": readForm(); form.minutes = +el.getAttribute("data-v"); render(); break;
    case "f-opp-pick": readForm(); form.opp = el.getAttribute("data-v"); render(); break;
    case "f-opp-roster": {
      readForm();
      var fk = (form.opp || "").trim().toLowerCase();
      if (fk && !S.oppRosters[fk]) { S.oppRosters[fk] = []; S.oppLabels[fk] = form.opp.trim(); save(); }
      if (fk) { ui.rOpp = fk; go("roster", { sec: "opp" }); } else go("roster", { sec: "opps" });
      break;
    }
    case "start": readForm(); newMatch(form); form = null; reset("live", {}, [{ view: "home", p: {} }]); break;

    case "r-add": {
      var inp = document.getElementById("r-new");
      splitNames(inp.value).forEach(function (n) { addToRoster(rosterList(), n); });
      save(); render();
      var again = document.getElementById("r-new"); if (again) again.focus();
      break;
    }
    case "r-del": rosterList().splice(+el.getAttribute("data-i"), 1); save(); render(); break;
    case "r-save": saveRosters(false); break;
    case "r-saveall": saveRosters(true); break;

    case "toggle":
      unlockAudio();
      if (m.run) { stopClock(m); releaseWake(); }
      else { m.run = Date.now(); m.started = true; holdWake(); }
      save(); tick(); break;
    case "adj": {
      var d = +el.getAttribute("data-d") * 1000;
      var cur = m.acc + (m.run ? Date.now() - m.run : 0);
      m.acc += Math.max(-cur, d);
      if (periodSec(m) < lenSec(m)) m.beeped = false;
      save(); tick(); break;
    }
    case "goal": unlockAudio(); addEvent("goal", el.getAttribute("data-t")); break;
    case "card": addEvent(el.getAttribute("data-c"), el.getAttribute("data-t")); break;
    case "end-period": {
      var last = m.period >= m.periods;
      ask(last ? "Fine partita?" : "Fine " + periodName(m.period) + "?",
        last ? "Il cronometro si ferma e vedi il risultato finale con i marcatori." : "Il cronometro si ferma. Riparti quando inizia il " + periodName(m.period + 1) + ".",
        last ? "Chiudi partita" : "Fine tempo",
        function () {
          if (last) return finishMatch();
          stopClock(m); m.status = "break"; releaseWake(); save(); reset("live", {}, [{ view: "home", p: {} }]);
        });
      break;
    }
    case "next-period":
      unlockAudio();
      m.period++; m.acc = 0; m.run = Date.now(); m.status = "play"; m.beeped = false; m.started = true;
      holdWake(); save(); reset("live", {}, [{ view: "home", p: {} }]); break;
    case "end-match":
      ask("Terminare la partita?", "La partita viene chiusa adesso con il risultato attuale (" + score(m, "home") + "-" + score(m, "away") + ").", "Termina", finishMatch, true);
      break;

    case "edit": ui.sheet = { mid: el.getAttribute("data-mid"), eid: el.getAttribute("data-id"), fresh: false }; ui.newPlayer = {}; renderLayer(); break;
    case "kind": {
      var before = playerTeam(se);
      se.kind = el.getAttribute("data-v");
      if (playerTeam(se) !== before) se.player = "";
      save(); render(); break;
    }
    case "pick": se[el.getAttribute("data-f") || "player"] = el.getAttribute("data-v"); save(); render(); break;
    case "pick-new": {
      var fld = el.getAttribute("data-f") || "player";
      var np = document.getElementById("new-" + fld), name = np.value.trim();
      if (!name) { np.focus(); break; }
      addToRoster(playersOf(sm, playerTeam(se)), name);
      se[fld] = name; ui.newPlayer[fld] = ""; save(); render(); break;
    }
    case "ev-min": se.sec = Math.max(0, se.sec + +el.getAttribute("data-d")); save(); render(); break;
    case "ev-team": {
      // evento registrato sulla squadra sbagliata: lo sposta sull'altra; i giocatori scelti erano dell'altra rosa
      var pBefore = playerTeam(se);
      se.team = other(se.team);
      if (playerTeam(se) !== pBefore) { se.player = ""; if (se.type === "sub") { se.on = ""; se.off = ""; } }
      save(); render(); toast("Assegnato a " + teamName(sm, se.team)); break;
    }
    case "past-add": addEvent(el.getAttribute("data-c"), el.getAttribute("data-t"), findMatch(ui.id)); break;
    case "ev-del": {
      var id = se.id;
      sm.events = sm.events.filter(function (x) { return x.id !== id; });
      ui.sheet = null; save(); render(); toast("Evento eliminato"); break;
    }
    case "sheet-close": ui.sheet = null; render(); break;

    case "c-yes": { var fn = ui.confirm.fn; ui.confirm = null; renderLayer(); fn(); break; }
    case "c-no": ui.confirm = null; renderLayer(); break;

    case "copy": copyText(resultText(findMatch(ui.id)), "Risultato copiato"); break;
    case "share": shareText(resultText(findMatch(ui.id)), "Condividi il risultato"); break;
    case "live-on": m.live = { topic: liveTopic() }; save(); render(); break;
    case "live-copy": copyText(liveURL(liveTarget()), "Link copiato"); break;
    case "live-share": {
      var lm = liveTarget();
      shareText("Segui in diretta " + lm.home + " - " + lm.away + ": " + liveURL(lm), "Condividi la diretta");
      break;
    }
    case "share-close": ui.share = null; renderLayer(); break;

    case "lu-open": {
      var lm = findMatch(el.getAttribute("data-mid")), lt = el.getAttribute("data-t") || lm.mySide;
      if (!lineupOf(lm, lt)) setLineup(lm, lt, newLineup(lm, lt));
      var LL = lineupOf(lm, lt);
      if (!LL.bench) LL.bench = benchOf(lm, lt, LL).slice();
      ui.lmid = lm.id; ui.luTeam = lt; ui.luQ = "";
      var empty = LL.slots.indexOf("");
      ui.luSlot = empty >= 0 ? empty : null;
      save(); go("lineup"); break;
    }
    case "lu-done": ui.luSlot = null; back(); break;
    case "lu-size": case "lu-mod": case "lu-slot": case "lu-pick": case "lu-add": case "lu-clear": case "lu-bench": case "lu-many":
      lineupAction(a, el); break;
    case "del-match":
      ask("Eliminare la partita?", "Il risultato e la cronaca vengono cancellati da questo telefono.", "Elimina", function () {
        S.history = S.history.filter(function (x) { return x.id !== ui.id; }); save(); reset("history", {}, [{ view: "home", p: {} }]);
      }, true);
      break;
  }
});

document.addEventListener("input", function (ev) {
  var id = ev.target.id;
  if (/^new-/.test(id)) { ui.newPlayer[id.slice(4)] = ev.target.value; filterChips(id.slice(4), ev.target.value); }
  if (id === "lu-q") { ui.luQ = ev.target.value; filterChips("lu", ev.target.value); }
});
// Invio: se la ricerca trova un solo nome lo sceglie. Un nome nuovo si aggiunge solo col pulsante.
function enterPick(key) {
  var box = document.querySelector('[data-picker="' + key + '"]');
  var hits = box ? Array.prototype.filter.call(box.querySelectorAll(".grp .chip[data-v]"), function (c) { return !c.hidden; }) : [];
  if (hits.length === 1) hits[0].click();
}
document.addEventListener("change", function (ev) {
  if (ev.target.id === "r-team") { S.settings.team = ev.target.value.trim(); save(); }
  if (ev.target.id === "r-file" && ev.target.files && ev.target.files[0]) {
    var f = ev.target.files[0], rd = new FileReader();
    rd.onload = function () { loadRosters(String(rd.result || ""), f.name); };
    rd.onerror = function () { toast("Non riesco a leggere il file"); };
    rd.readAsText(f);
    ev.target.value = "";
  }
  if (ev.target.id === "ev-minute" && ui.sheet) {
    var mm = findMatch(ui.sheet.mid), ee = mm && mm.events.filter(function (x) { return x.id === ui.sheet.eid; })[0];
    if (ee && setMinute(mm, ee, ev.target.value)) { save(); render(); } else toast("Scrivi il minuto, es. 38 o 45+2");
  }
});
document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Enter") return;
  var id = ev.target.id;
  if (id === "r-new") { ev.preventDefault(); document.querySelector('[data-a="r-add"]').click(); }
  if (/^new-/.test(id) && ev.target.value.trim()) { ev.preventDefault(); enterPick(id.slice(4)); }
  if (id === "lu-q" && ev.target.value.trim()) { ev.preventDefault(); enterPick("lu"); }
  if (id === "r-oppname") { ev.preventDefault(); document.querySelector('[data-a="r-oppnew"]').click(); }
  if (id === "lu-new") { ev.preventDefault(); document.querySelector('[data-a="lu-many"]').click(); }
  if (id === "r-team" || id === "ev-minute") ev.target.blur();
});

render();
if (S.match && S.match.run) holdWake();
// Tasto "indietro" di Android: chiude il foglio aperto o torna al menu; 0 = lascia uscire dall'app.
window.bcBack = function () {
  if (ui.confirm || ui.share || ui.sheet) { ui.confirm = null; ui.share = null; ui.sheet = null; render(); return 1; }
  if (ui.view !== "home") { ui.luSlot = null; back(); return 1; }
  return 0;
};
if (liveTarget()) livePush();
window.addEventListener("online", function () { if (liveTarget()) livePush(); });

try {
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor) navigator.serviceWorker.register("sw.js").catch(function () {});
} catch (e) {}
})();
</script>
