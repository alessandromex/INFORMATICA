<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MisterBook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MisterBook">
<meta name="theme-color" content="#1c5a34">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: una colonna da telefono; il tabellone scuro in alto resta sempre leggibile a bordocampo, sotto comandi e cronologia. */
/* Layout: una colonna, sfondo a campo verde (come la grafica di MisterBook); ogni schermata ha poche
   cose grandi da toccare: schede bianche con icona, testo e freccia. Tema unico, pensato per l'esterno. */
:root {
  --field: #1c5a34;
  --field-2: #19532f;
  --on-field: #ffffff;
  --on-field-muted: rgba(255,255,255,.78);
  --brand: #f5c518;
  --brand-ink: #13201a;
  --soft: #eef2ef;
  --surface: #ffffff;
  --ink: #13201a;
  --muted: #5a6a61;
  --line: #d6dfd9;
  --accent: #13804a;
  --accent-ink: #ffffff;
  --board: #0b2416;
  --board-2: #143522;
  --board-ink: #f1f6f2;
  --board-muted: #9fb8a8;
  --led: #ffcf3a;
  --yellow: #f2c200;
  --red: #d7263d;
  --danger: #b3192d;
  --ball: #ffffff;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
  --grass-1: #2e8b4f;
  --grass-2: #287c46;
  --chalk: rgba(255,255,255,.6);
  --kit: #ffffff;
  --kit-ink: #0d1912;
  --kit-gk: #ffcf3a;
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--on-field);
  background: var(--field) repeating-linear-gradient(180deg, transparent 0 96px, rgba(0,0,0,.07) 96px 192px);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--field); }
/* linee del campo sullo sfondo: metà campo e cerchio di centrocampo in basso */
.lines { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.lines i { position: absolute; display: block; border: 2px solid rgba(255,255,255,.13); }
.lines .c { left: 50%; bottom: -150px; width: 300px; height: 300px; border-radius: 50%; transform: translateX(-50%); }
.lines .h { left: 0; right: 0; bottom: 0; height: 0; border-width: 2px 0 0; }
.lines .v { top: 0; bottom: 0; left: 50%; width: 0; border-width: 0 0 0 2px; opacity: .6; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1;
}
.panel, .sheet, .tile { color: var(--ink); }
#app > .note { color: var(--on-field-muted); }
#app > h1 { color: var(--on-field); }
.tabnum { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* barra superiore */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 44px; }
.top > :first-child { justify-self: start; }
.top > :last-child { justify-self: end; }
.top .title { font-family: var(--font-display); font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: .03em; text-align: center; }
.top .link { color: var(--on-field); font-size: 17px; padding: 10px 6px 10px 0; }
.lead { margin: 0; font: 700 30px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .02em; color: var(--on-field); text-wrap: balance; }
.lead small { display: block; font: 500 16px/1.3 var(--font-body); text-transform: none; letter-spacing: 0; color: var(--on-field-muted); margin-top: 4px; }
.link { color: var(--accent); font-weight: 600; padding: 8px 4px; }
.link.danger { color: var(--danger); }

/* pulsanti */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 18px; border-radius: var(--r);
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-weight: 600; font-size: 17px;
}
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.btn.ghost { background: rgba(255,255,255,.12); color: var(--on-field); border-color: rgba(255,255,255,.35); }
.btn.big { min-height: 64px; font-size: 20px; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1; }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 2px; text-align: left; width: 100%; }
.item .grow { min-width: 0; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 8px 2px; }

/* form */
label.btn { cursor: pointer; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; color: var(--muted); }
input[type=text] {
  width: 100%; min-height: 50px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--soft); color: var(--ink); font-size: 17px;
}
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { min-height: 44px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 50px; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); font-size: 26px; font-weight: 500; }
.stepper .v { font-family: var(--font-display); font-size: 34px; font-weight: 700; min-width: 64px; text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft); font-weight: 600; font-size: 15px; }
.chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.pick { display: flex; flex-direction: column; gap: 10px; }
.pick input[type=text] { width: 100%; }
.grp { display: flex; flex-direction: column; gap: 6px; }
.grp h4 { margin: 0; font: 600 13px/1.2 var(--font-body); color: var(--muted); }
.stepper input.minute { width: 84px; min-width: 0; flex: none; height: 50px; text-align: center; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); color: var(--ink); font-family: var(--font-display); font-size: 26px; font-weight: 700; padding: 0; }
.chip.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* tabellone */
.board {
  background: var(--board); color: var(--board-ink); border-radius: 20px;
  padding: 16px 14px 18px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
}
.board-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: 15px; color: var(--board-muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--board-muted); }
.pill.on { color: #5fe39a; }
.pill.on .dot { background: #5fe39a; animation: blink 1.2s infinite; }
.pill.over { color: var(--led); }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.on .dot { animation: none; } }
.clockwrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.clock { font-family: var(--font-display); font-weight: 700; font-size: 84px; line-height: .95; color: var(--led); font-variant-numeric: tabular-nums; letter-spacing: .01em; display: flex; align-items: baseline; gap: 10px; }
.clock .extra { font-size: 34px; color: var(--led); }
.cd { font-family: var(--font-display); font-size: 20px; color: var(--board-muted); text-transform: uppercase; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.cd b { color: var(--board-ink); font-size: 26px; font-weight: 700; letter-spacing: .02em; }
.cd.over b { color: var(--red); }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 6px; }
.team { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.tname-row { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; }
.tname { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; text-align: center; line-height: 1.05; overflow-wrap: anywhere; min-width: 0; }
.tname .mine { display: block; font-size: 12px; color: var(--board-muted); letter-spacing: .1em; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 76px; line-height: 1; font-variant-numeric: tabular-nums; }
.vs { font-family: var(--font-display); font-size: 48px; color: var(--board-muted); padding-top: 64px; }
.ball {
  flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
  background: var(--board-2); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14);
}
.ball svg { width: 40px; height: 40px; }
.ball:active { transform: scale(.92); background: var(--accent); }
.ball[disabled] { opacity: .35; }
.ballsvg .w { fill: var(--ball); }
.ballsvg .k { fill: #101512; }
.ballsvg .s, .ballsvg .ring { stroke: #101512; }
.cardbtns { display: flex; gap: 10px; }
.cardbtn { width: 44px; height: 50px; display: grid; place-items: center; border-radius: 10px; background: var(--board-2); }
.cardbtn i { display: block; width: 20px; height: 28px; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.5); }
.cardbtn.y i { background: var(--yellow); }
.cardbtn.r i { background: var(--red); }
.cardbtn:active { transform: scale(.92); }
.cardbtn[disabled] { opacity: .35; }
.cardbtn.s svg { width: 26px; height: 26px; }
.subsvg .up { stroke: #5fe39a; }
.subsvg .down { stroke: #ff6b7d; }
.ico .subsvg .up { stroke: var(--accent); }
.tile .subsvg .up { stroke: #1f8a4c; }
.tile .subsvg .down { stroke: #d7263d; }
.ico .subsvg .down { stroke: var(--danger); }
.who .on, .who .off { display: block; }
.who .on::before, .who .off::before { display: inline-block; width: 1.1em; font-size: .8em; }
.who .on::before { content: "\25B2"; color: var(--accent); }
.who .off::before { content: "\25BC"; color: var(--danger); }
.who .off { font-weight: 500; color: var(--muted); }

/* logo */
.logo { display: flex; align-items: center; justify-content: center; gap: 18px; padding-block: 18px 10px; }
.logo .word { display: flex; flex-direction: column; font: 800 54px/.9 var(--font-display); letter-spacing: .01em; }
.logo .word .y { color: var(--brand); }
.logo svg { width: 118px; height: 88px; flex: none; }
.logo.sm { padding-block: 4px 0; gap: 12px; }
.logo.sm .word { font-size: 34px; }
.logo.sm svg { width: 70px; height: 52px; }

/* schede grandi da toccare */
.tiles { display: flex; flex-direction: column; gap: 10px; }
.tile {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 78px; padding: 10px 14px 10px 12px;
  background: var(--surface); border-radius: 10px; text-align: left; box-shadow: 0 3px 0 rgba(0,0,0,.18);
}
.tile:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.tile[disabled] { opacity: .55; }
.tile .ti { width: 58px; height: 58px; flex: none; display: grid; place-items: center; color: var(--ink); }
.tile .ti svg { width: 54px; height: 54px; }
.tile .tlab { flex: 1; min-width: 0; font: 700 23px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.tile .tlab small { display: block; margin-top: 3px; font: 500 14px/1.3 var(--font-body); text-transform: none; letter-spacing: 0; color: var(--muted); }
.tile .chev { flex: none; width: 12px; color: #c99a00; }
.tile .chev svg { width: 12px; height: 20px; display: block; }
.tiles.compact .tile { min-height: 62px; padding-block: 6px; }
.tiles.compact .tile .ti { width: 46px; height: 46px; }
.tiles.compact .tile .ti svg { width: 42px; height: 42px; }
.tiles.small { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tiles.small .tile { flex-direction: column; justify-content: center; gap: 4px; min-height: 82px; padding: 8px 4px; text-align: center; }
.tiles.small .tile .ti { width: 34px; height: 34px; }
.tiles.small .tile .ti svg { width: 32px; height: 32px; }
.tiles.small .tile .tlab { flex: none; font-size: 15px; }
.tiles.small .chev { display: none; }
/* colori sociali */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.sw[aria-pressed=true] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent); }
.sw.custom { display: grid; place-items: center; background: var(--soft); font-weight: 700; color: var(--muted); position: relative; overflow: hidden; }
.sw.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.kitprev { display: flex; align-items: center; gap: 12px; }
.kitprev .shirt { width: 44px; height: 44px; }
/* procedure guidate di gol, cartellini e cambi */
.evl { display: flex; flex-direction: column; }
.evl .er { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.evl .er + .er { border-top: 1px solid var(--line); }
.evl .er .eb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; padding: 4px 0; }
.evl .er .mn { font: 700 20px var(--font-display); min-width: 46px; font-variant-numeric: tabular-nums; }
.evl .er .del { flex: none; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); color: var(--danger); font-weight: 600; background: var(--surface); }
.recap { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; font-size: 18px; }
.recap dt { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .06em; }
.recap dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.guide { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: rgba(0,0,0,.22); color: var(--on-field); font-size: 15px; }
.guide span b { color: var(--brand); }
.guide .gn { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); font: 800 15px var(--font-display); }
/* convocazione: ogni giocatore della rosa in campo, in panchina o in tribuna */
.cvhead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; border-radius: 12px; background: var(--board); color: var(--board-ink); text-align: center; }
.cvhead b { display: block; font: 800 28px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.cvhead span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--board-muted); }
.cvhead .over b { color: var(--led); }
.cvrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.cvrow + .cvrow { border-top: 1px solid var(--line); }
.cvrow .nm { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.seg3 { display: grid; grid-template-columns: repeat(3, 58px); gap: 3px; background: var(--soft); border-radius: 10px; padding: 3px; flex: none; }
.seg3 button { min-height: 40px; border-radius: 8px; font: 600 12px/1.1 var(--font-body); color: var(--muted); }
.seg3 button[aria-pressed=true][data-v=campo] { background: var(--accent); color: #fff; }
.seg3 button[aria-pressed=true][data-v=panchina] { background: var(--brand); color: var(--brand-ink); }
.seg3 button[aria-pressed=true][data-v=tribuna] { background: #6b7a72; color: #fff; }
.step { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 800 16px var(--font-display); background: var(--soft); color: var(--muted); }
.step.ok { background: var(--accent); color: #fff; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fields .wide { grid-column: 1 / -1; }
input[type=date], input[type=time], textarea.field { width: 100%; min-height: 50px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); font-size: 17px; }
textarea.field { padding: 10px 12px; min-height: 76px; font: 16px/1.35 var(--font-body); }
.logoprev { width: 72px; height: 96px; object-fit: contain; background: var(--soft); border-radius: 8px; }
/* anteprima A4 della convocazione: carta sempre bianca, come la stampa */
.sheetwrap { width: 100%; overflow: hidden; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.3); background: #fff; }
.a4 { width: 595px; height: 842px; background: #fff; color: #000; font-family: "Times New Roman", Times, serif; position: relative; transform-origin: top left; }
.a4 .fr { position: absolute; left: 34px; top: 62px; width: 527px; min-height: 714px; border: 6px solid var(--cf, #9B3B33); padding: 30px 30px 18px 32px; }
.a4 .club { text-align: center; color: var(--c1, #800020); font-size: 20px; margin: 6px 0; }
.a4 .lg { display: block; margin: 0 auto 10px; width: 61px; height: 83px; object-fit: contain; }
.a4 .tit { text-align: center; color: #323232; font-size: 11.5px; margin: 6px 0 10px; }
.a4 .tit .c { color: #EE0000; font-weight: 700; } .a4 .tit .u { color: #000; font-weight: 700; font-size: 16px; }
.a4 .ln { font-size: 11px; margin: 0 0 6px; } .a4 .ln.gap { margin-top: 12px; }
.a4 .lb { color: var(--c1, #800020); }
.a4 .el { color: var(--c1, #800020); font-size: 12px; margin: 24px 0 4px; }
.a4 table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 11px; }
.a4 td { border: .7px solid #000; padding: 3px 5px; height: 20px; overflow-wrap: anywhere; line-height: 1.15; }
.a4 td.n { color: var(--c1, #800020); width: 48px; }
.a4 .nt { font-size: 10px; margin-top: 26px; } .a4 .nt .h { color: var(--c1, #800020); font-size: 12px; }
.a4 ul { font-size: 10px; margin: 8px 0 0; padding-left: 18px; } .a4 li { margin-bottom: 4px; }
.a4 .motto { text-align: center; color: var(--c1, #800020); font-size: 12px; margin-top: 14px; }
.tile.big { min-height: 104px; }
.tile.big .tlab { font-size: 28px; }
.bigcard { display: block; width: 34px; height: 46px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.35); }
.bigcard.y { background: var(--yellow); }
.bigcard.r { background: var(--red); }
.navbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.22); }
.navbar .btn { min-height: 54px; font: 700 19px/1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.navbar .btn.ghost[disabled] { opacity: .35; }
.langs { display: flex; justify-content: center; gap: 8px; margin-top: 6px; }
.langs button { padding: 8px 16px; border-radius: 999px; color: var(--on-field); border: 1px solid rgba(255,255,255,.35); font-weight: 600; }
.langs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: transparent; }
.danger-link { align-self: center; color: #ffd9de; font-weight: 600; padding: 12px; text-decoration: underline; }

/* tabellone essenziale della partita */
.board.hub { padding: 12px 12px 14px; gap: 6px; }
.hub .scoreline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
.hub .side { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.hub .nm { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; }
.hub .tname { font-size: 18px; }
.hub .score { font-size: 56px; }
.hub .vs { padding-top: 0; font-size: 40px; }
.hub .ball { width: 46px; height: 46px; }
.hub .ball svg { width: 34px; height: 34px; }
.hub .clock { font-size: 64px; }
.hub .nm { min-height: 46px; }

/* comandi partita */
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.controls .span { grid-column: 1 / -1; }
.adj { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.adj button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; }
.adj-label { font-size: 13px; color: var(--muted); text-align: center; }

/* cronologia */
.tl { display: flex; flex-direction: column; }
.tl-period { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; padding: 10px 2px 6px; border-bottom: 1px solid var(--line); }
.ev { display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.ev .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ev .side.r { flex-direction: row-reverse; text-align: right; }
.ev .who { font-weight: 600; overflow-wrap: break-word; min-width: 0; }
.ev .who small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }
.ev .min { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.ico { flex: none; width: 22px; height: 22px; display: grid; place-items: center; }
.ico svg { width: 22px; height: 22px; }
.ico .card { width: 14px; height: 19px; border-radius: 2px; }
.ico .card.y { background: var(--yellow); }
.ico .card.r { background: var(--red); }
.ico .card.yr { background: linear-gradient(135deg, var(--yellow) 50%, var(--red) 50%); }

.ballsvg.inline .k { fill: var(--ink); }
.ballsvg.inline .s { stroke: var(--ink); }
.ballsvg.inline .ring { stroke: var(--ink); }

.sheet {

.sh-head .bigmin { font-family: var(--font-display); font-size: 34px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.sh-foot { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.note { font-size: 14px; color: var(--muted); }

.final .scoreline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.final .score { font-size: 72px; }

.scorers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; color: var(--board-ink); }
.scorers > div { min-width: 0; overflow-wrap: anywhere; }
.scorers .r { text-align: right; }
.scorers p { margin: 0 0 4px; }
.textout { width: 100%; min-height: 160px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); padding: 12px; font: 15px/1.45 var(--font-body); }

/* campo della formazione: stesso aspetto in tema chiaro e scuro */
.pitch {

}
.pitch.mini { aspect-ratio: 68 / 62; }
.pitch > i { position: absolute; border: 2px solid var(--chalk); }

.pitch .pl-six { left: 38%; right: 38%; bottom: -2px; height: 6%; }
.pitch .pl-arc { left: 50%; top: 0; width: 28%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); }

}
.pp.gk .shirt { background: var(--kit-gk); }
.pp.empty .shirt { background: rgba(255,255,255,.14); color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.75); font-size: 22px; font-weight: 500; }
.pp.out .shirt { opacity: .45; }
.pp[aria-pressed=true] .shirt { box-shadow: 0 0 0 3px var(--led), 0 2px 5px rgba(0,0,0,.35); }

.pn:empty { display: none; }
.bd { position: absolute; top: -5px; left: calc(50% + 11px); display: flex; gap: 2px; align-items: center; }
.bd i { display: block; font-style: normal; }
.b-ball { position: relative; width: 15px; height: 15px; }
.b-ball svg { width: 15px; height: 15px; }
.b-ball b { position: absolute; right: -6px; bottom: -5px; font: 800 11px/1 var(--font-display); color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.b-card { width: 9px; height: 12px; border-radius: 1.5px; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
.b-card.y { background: var(--yellow); }
.b-card.r { background: var(--red); }
.b-card.yr { background: linear-gradient(135deg, var(--yellow) 50%, var(--red) 50%); }
.b-in { color: #5fe39a; font-size: 11px; line-height: 1; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.pitch.mini .shirt { width: 34px; height: 34px; font-size: 15px; }

.bench .bp { padding: 3px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); }
.bench .bp small { color: var(--muted); margin-left: 4px; }

/* diretta */
.live-link { font: 600 15px/1.3 var(--font-body); min-height: 46px; }
.live-st { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.live-st .dot { flex: none; }
.live-st.ok .dot { background: var(--accent); }
.live-st.err { color: var(--danger); }
.live-st.err .dot { background: var(--danger); }

@media (max-width: 380px) {
  .logo .word { font-size: 44px; }
  .logo svg { width: 92px; height: 70px; }
  .hub .clock { font-size: 60px; }
  .hub .score { font-size: 54px; }
  .clock { font-size: 70px; }
  .score { font-size: 64px; }
  .tname { font-size: 17px; }
  .ball { width: 50px; height: 50px; }
}

// Moduli per numero di giocatori in campo (portiere escluso dalla sigla).
var MODULI = {
  5: ["2-2", "1-2-1", "2-1-1"],
  7: ["2-3-1", "3-2-1", "3-1-2", "2-1-2-1"],
  8: ["3-3-1", "2-3-2", "3-2-2"],

  11: ["4-4-2", "4-3-3", "3-5-2", "4-2-3-1", "3-4-3", "5-3-2"]

function modSize(mod) { return 1 + mod.split("-").reduce(function (a, b) { return a + +b; }, 0); }
function fitSlots(slots, n) { slots = slots.slice(0, n); while (slots.length < n) slots.push(""); return slots; }
function oppKey(m) { return teamName(m, other(m.mySide)).trim().toLowerCase(); }
function lineupOf(m, t) { return t === m.mySide ? m.lineup : m.oppLineup; }

function hasLineup(m, t) { var L = lineupOf(m, t || m.mySide); return !!(L && L.slots.some(Boolean)); }
// Panchina: i convocati scelti; nelle formazioni salvate prima di questa funzione era "tutti gli altri della rosa".
function benchOf(m, t, L) {
  if (L.bench) return L.bench;
  return playersOf(m, t).filter(function (n) { return L.slots.indexOf(n) < 0; });
}

  var mem = t === m.mySide ? { mod: S.settings.lineupMod, slots: S.settings.lineupSlots, bench: S.settings.lineupBench } : (S.oppLineups[oppKey(m)] || {});
  var mine = m.lineup && t !== m.mySide ? m.lineup.mod : null;
  var roster = playersOf(m, t), mod = mem.mod || mine || S.settings.lineupMod || "4-4-2";
  var slots = fitSlots((mem.slots || []).map(function (n) { return roster.indexOf(n) >= 0 ? n : ""; }), modSize(mod));

// Chi è in campo e in panchina, con gol, cartellini e ingressi, applicando i cambi in ordine.
// Con before si ferma all'evento indicato: serve a scegliere i giocatori nel foglio di quell'evento.
function fieldState(m, before, t) {
  t = t || m.mySide;
  var L = lineupOf(m, t);
  if (!L) return null;
  var cur = L.slots.slice(), bench = benchOf(m, t, L).slice(), stats = {};
  var st = function (n) { return stats[n] || (stats[n] = { g: 0, y: 0, r: false, inAt: "", outAt: "" }); };
  var list = sorted(m);
  for (var i = 0; i < list.length && list[i] !== before; i++) {
    var e = list[i];
    if (e.type === "goal" && e.team === t && e.kind !== "autogol" && e.player) st(e.player).g++;
    if (e.team !== t) continue;
    if (e.type === "yellow" && e.player) { var y = st(e.player); y.y++; if (y.y >= 2) y.r = true; }
    if (e.type === "red" && e.player) st(e.player).r = true;
    if (e.type === "sub" && e.off && e.on) {
      var k = cur.indexOf(e.off);
      if (k >= 0) {
        cur[k] = e.on;
        bench = bench.filter(function (n) { return n !== e.on; });
        if (bench.indexOf(e.off) < 0) bench.push(e.off);
        st(e.on).inAt = st(e.off).outAt = minuteLabel(m, e.period, e.sec);
      }
    }
  }
  return { mod: L.mod, slots: cur, bench: bench, stats: stats };
}
function shirtOf(name) {

// Disegna il campo: righe dal portiere (in basso) agli attaccanti (in alto), come nelle presentazioni TV.

      var cls = "pp" + (i === 0 ? " gk" : "") + (name ? "" : " empty") + (s.r ? " out" : "");
      var attr = ' style="left:' + ((j + 1) * 100 / (n + 1)).toFixed(1) + "%;top:" + y.toFixed(1) + "%;width:calc(" + (100 / n).toFixed(1) + '% - 4px)"';

/* ---------- testo del risultato ---------- */
function kindTag(e) { return e.kind === "rigore" ? L(" (rig.)", " (pen.)") : e.kind === "autogol" ? L(" (aut.)", " (o.g.)") : ""; }
function scorersOf(m, t) {
  var groups = [], byName = {};
  sorted(m).forEach(function (e) {
    if (e.type !== "goal" || e.team !== t) return;
    var name = e.player || T("Marcatore non indicato");
    if (!byName[name]) { byName[name] = { name: name, mins: [] }; groups.push(byName[name]); }
    byName[name].mins.push(minuteLabel(m, e.period, e.sec) + kindTag(e));
  });
  return groups.map(function (g) { return g.name + " " + g.mins.join(", "); });
}
function cardsOf(m, kind) {
  return sorted(m).filter(function (e) {
    if (kind === "yellow") return e.type === "yellow" && !secondYellow(m, e);
    return e.type === "red" || secondYellow(m, e);
  }).map(function (e) {
    return (e.player || T("Giocatore non indicato")) + " (" + teamName(m, e.team) + ") " + minuteLabel(m, e.period, e.sec) + (secondYellow(m, e) ? L(" doppia amm.", " 2nd yellow") : "");
  });
}

function subsOf(m) {
  return sorted(m).filter(function (e) { return e.type === "sub"; }).map(function (e) {
    return teamName(m, e.team) + " " + minuteLabel(m, e.period, e.sec) + L(": entra ", ": on ") + (e.on || T("non indicato")) + L(", esce ", ", off ") + (e.off || T("non indicato"));
  });
}
function partials(m) {
  var out = [];
  for (var p = 1; p <= m.periods; p++) out.push(L(p + "°T ", ord(p) + " ") + score(m, "home", p) + "-" + score(m, "away", p));
  return out;
}
function dateLabel(iso) {
  try { return new Date(iso).toLocaleDateString(LOC, { weekday: "short", day: "numeric", month: "long", year: "numeric" }); } catch (e) { return ""; }
}
function resultText(m) {
  var L0 = [];
  L0.push(teamName(m, "home") + " " + score(m, "home") + " - " + score(m, "away") + " " + teamName(m, "away"));
  L0.push(dateLabel(m.date) + " · " + m.periods + L(" tempi da ", " × ") + m.minutes + "'");
  if (m.periods > 1) L0.push(L("Parziali: ", "By period: ") + partials(m).join(" · "));
  ["home", "away"].forEach(function (t) { if (hasLineup(m, t)) L0.push("", lineupText(m, t)); });
  ["home", "away"].forEach(function (t) {
    var s = scorersOf(m, t);
    if (s.length) L0.push("", "⚽ " + teamName(m, t) + ":", s.join("\n"));
  });
  var y = cardsOf(m, "yellow"), r = cardsOf(m, "red");
  if (y.length) L0.push("", "🟨 " + T("Ammoniti") + ":", y.join("\n"));
  if (r.length) L0.push("", "🟥 " + T("Espulsi") + ":", r.join("\n"));
  var c = subsOf(m);
  if (c.length) L0.push("", "🔁 " + T("Cambi") + ":", c.join("\n"));
  return L0.join("\n");
}

// La diretta passa da ntfy.sh (servizio di messaggi gratuito, senza account): a ogni modifica

var NTFY = "https://ntfy.sh/";
var PAGES = "https://alessandromex.github.io/INFORMATICA/partita/";
var liveTimer = null, liveRetry = null;
function liveTopic() {
  var a = new Uint8Array(16), out = "misterbook-";
  try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < a.length; i++) a[i] = Math.random() * 256; }
  for (var k = 0; k < a.length; k++) out += "abcdefghijkmnpqrstuvwxyz23456789"[a[k] % 32];
  return out;
}
function liveURL(m) {
  var base = /github\.io$/.test(location.hostname) ? new URL("diretta.html", location.href).href.split("?")[0] : PAGES + "diretta.html";
  return base + "?id=" + m.live.topic;
}
function snap(m) {
  return {
    v: 1, h: m.home, a: m.away, s: m.mySide, P: m.periods, M: m.minutes, pe: m.period, st: m.status,
    F: ["home", "away"].map(function (t) {
      var L = lineupOf(m, t);
      return hasLineup(m, t) ? { m: L.mod, s: L.slots, b: benchOf(m, t, L) } : null;
    }),
    sd: m.started ? 1 : 0, p: m.acc + (m.run ? Date.now() - m.run : 0), r: m.run ? 1 : 0, t: Date.now(), d: m.date,
    e: sorted(m).map(function (e) {
      // nel cambio chi esce va in [4] e chi entra in [6]
      if (e.type === "sub") return ["s", e.team === "home" ? 0 : 1, e.period, e.sec, e.off || "", "", e.on || ""];
      return [e.type[0], e.team === "home" ? 0 : 1, e.period, e.sec, e.player || "", e.kind === "rigore" ? "r" : e.kind === "autogol" ? "o" : ""];
    })

}
function liveTarget() {
  if (S.match && S.match.live) return S.match;
  if (ui.view === "summary") { var m = findMatch(ui.id); if (m && m.live) return m; }
  return null;
}
function liveSchedule() { if (liveTarget()) { clearTimeout(liveTimer); liveTimer = setTimeout(livePush, 700); } }
function livePush() {
  var m = liveTarget();
  if (!m) return;
  clearTimeout(liveRetry);
  m.live.state = "sending"; liveStatus();
  fetch(NTFY + m.live.topic, { method: "POST", body: JSON.stringify(snap(m)) })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      m.live.state = "ok"; m.live.sent = Date.now(); store(); liveStatus();
    })
    .catch(function () {
      m.live.state = "err"; liveStatus();
      liveRetry = setTimeout(livePush, 15000);
    });
}
function liveStatusText(m) {
  if (m.live.state === "err") return "Nessuna connessione: riprovo tra poco. La partita resta salvata sul telefono.";
  if (m.live.state === "sending") return "Invio aggiornamento…";
  if (m.live.sent) return "Aggiornata alle " + new Date(m.live.sent).toLocaleTimeString(LOC);
  return "In attesa del primo invio";
}
function liveStatus() {
  var el = document.getElementById("live-st"), m = liveTarget();

}
function livePanel(m) {

    return '<section class="panel"><h2>Diretta per i genitori</h2>' +
      '<div class="note">Crea un link da mandare nel gruppo della squadra: chi lo apre vede risultato, minuto e marcatori in tempo reale, senza installare niente.</div>' +
      '<button class="btn primary block" data-a="live-on">Crea link della diretta</button></section>';
  }

    '<input type="text" class="live-link" id="live-link" readonly value="' + esc(liveURL(m)) + '" aria-label="Link della diretta">' +
    '<div class="controls"><button class="btn primary" data-a="live-copy">Copia link</button><button class="btn" data-a="live-share">Condividi</button></div>' +

/* ---------- condivisione ---------- */
// Nell'app Android usa il pannello di condivisione di sistema (plugin Share di Capacitor),
// nel browser la Web Share API, altrimenti mostra il testo da copiare.
function shareText(text, title) {
  var show = function () { ui.share = text; renderLayer(); };
  try {
    var C = window.Capacitor;
    if (C && C.isNativePlatform && C.isNativePlatform() && C.nativePromise) {
      C.nativePromise("Share", "share", { text: text, dialogTitle: T(title || "Condividi") }).catch(show);
      return;
    }
    if (navigator.share) {
      navigator.share({ text: text }).catch(function (err) { if (!err || err.name !== "AbortError") show(); });
      return;
    }
  } catch (e) {}
  show();
}
function copyText(text, done) {
  var fallback = function () { ui.share = text; renderLayer(); };
  try { navigator.clipboard.writeText(text).then(function () { toast(done); }, fallback); } catch (e) { fallback(); }
}

function back() {
  var s = ui.stack.pop() || { view: "home", p: {} };

  ui.view = s.view; ui.p = s.p || {}; ui.sheet = s.sheet || null;
  render(); window.scrollTo(0, 0);

function forward() {
  var f = ui.fwd.pop();

  ui.stack.push({ view: ui.view, p: ui.p, sheet: ui.sheet });

  render(); window.scrollTo(0, 0);
}

/* ---------- lettura della distinta ---------- */
// La foto viene letta sul telefono con Tesseract (OCR nel browser): non viene inviata a nessun servizio.
// Si scaricano solo, la prima volta, la libreria e i dati della lingua italiana.
var TESSERACT = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
function loadScript(src) {
  return new Promise(function (ok, ko) {
    if (window.Tesseract) return ok();
    var sc = document.createElement("script");
    sc.src = src; sc.onload = function () { ok(); }; sc.onerror = function () { ko(new Error("rete")); };
    document.head.appendChild(sc);
  });
}
// Prepara la foto per l'OCR: ingrandita o ridotta a ~2400 px, bianco e nero con soglia locale (regge le
// ombre) e soprattutto senza le linee della tabella, che altrimenti confondono la lettura delle celle.
function prepImage(file) {
  return new Promise(function (ok, ko) {
    var img = new Image(), url = URL.createObjectURL(file);

      var c = document.createElement("canvas"), W = c.width = Math.round(img.width * k), H = c.height = Math.round(img.height * k);
      var g = c.getContext("2d");
      g.drawImage(img, 0, 0, W, H);
      URL.revokeObjectURL(url);
      var d = g.getImageData(0, 0, W, H), px = d.data, gray = new Float32Array(W * H), x, y, t, j;
      for (j = 0; j < W * H; j++) gray[j] = 0.299 * px[j * 4] + 0.587 * px[j * 4 + 1] + 0.114 * px[j * 4 + 2];
      // inchiostro = più scuro della media del suo riquadro 32×32
      var B = 32, bw = Math.ceil(W / B), bh = Math.ceil(H / B), mean = new Float32Array(bw * bh), cnt = new Float32Array(bw * bh);
      for (y = 0; y < H; y++) for (x = 0; x < W; x++) { j = ((y / B) | 0) * bw + ((x / B) | 0); mean[j] += gray[y * W + x]; cnt[j]++; }
      for (j = 0; j < mean.length; j++) mean[j] /= cnt[j];
      var ink = new Uint8Array(W * H);
      for (y = 0; y < H; y++) for (x = 0; x < W; x++) ink[y * W + x] = gray[y * W + x] < mean[((y / B) | 0) * bw + ((x / B) | 0)] - 25 ? 1 : 0;
      var out = new Uint8Array(ink), band = 2, run, on, L = Math.round(W * 0.05), LV = Math.round(H * 0.03);
      // linee orizzontali, anche un po' storte (banda di ±2 pixel)
      for (y = band; y < H - band; y++) {
        run = 0;
        for (x = 0; x <= W; x++) {
          on = 0;
          if (x < W) for (t = -band; t <= band; t++) if (ink[(y + t) * W + x]) { on = 1; break; }
          if (on) run++;
          else { if (run > L) for (var xx = x - run; xx < x; xx++) for (t = -band; t <= band; t++) out[(y + t) * W + xx] = 0; run = 0; }
        }
      }
      // linee verticali
      for (x = band; x < W - band; x++) {
        run = 0;
        for (y = 0; y <= H; y++) {
          on = 0;
          if (y < H) for (t = -band; t <= band; t++) if (ink[y * W + x + t]) { on = 1; break; }
          if (on) run++;
          else { if (run > LV) for (var yy = y - run; yy < y; yy++) for (t = -band; t <= band; t++) out[yy * W + x + t] = 0; run = 0; }
        }
      }
      for (j = 0; j < W * H; j++) px[j * 4] = px[j * 4 + 1] = px[j * 4 + 2] = out[j] ? 0 : 255;
      g.putImageData(d, 0, 0);
      ok(c);
    };
    img.onerror = function () { URL.revokeObjectURL(url); ko(new Error("immagine")); };
    img.src = url;
  });
}
function titleCase(s) {
  return s.toLowerCase().replace(/(^|[\s'’.-])([a-zà-ÿ])/g, function (m, a, b) { return a + b.toUpperCase(); });
}
// Dal testo della distinta FIGC-LND: righe "n° ruolo  COGNOME NOME  (C/V) matricola …" fino a
// "Assistente dell'Arbitro" / Dirigente / Allenatore; date, matricole e documenti vengono scartati.
// Funziona anche col testo copiato dalla foto (Testo attivo, Google Lens) o con un semplice elenco.
function parseDistinta(text) {
  var lines = String(text || "").split(/\r?\n/), players = [], seen = {}, team = "", started = false;
  var hasHeader = /cognome|surname|last name/i.test(String(text || ""));  // distinta intera; altrimenti è un elenco incollato
  var stop = /assistente|dirigente|allenatore|massaggiatore|medico|preparatore|arbitro|\bnote\b/i;
  var noise = /^(TESS|FIGC|LND|CI|C\.?I\.?|PAT|PASS|PASSAPORTO|CARTA|IDENTITA|DOC|DOCUMENTO|CAPITANO|RUOLO|COGNOME|NOME|DATA|NASCITA|MATRICOLA|ESPULSI|AMMONITI)$/;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].replace(/[|\[\]{}()_—–«»“”"]/g, " ").replace(/\s+/g, " ").trim();
    if (!line) continue;
    var tm = !team && /^\d{4,7}\s+([A-Z0-9][A-Z0-9 .'’&-]{2,})$/.exec(line);
    if (tm) { team = titleCase(tm[1].trim()); continue; }
    if (/cognome|surname|last name/i.test(line)) { started = true; continue; }
    if (stop.test(line)) { if (started || players.length) break; continue; }
    if (hasHeader && !started) continue;

// Salva o condivide un file binario: app Android → file nella cache + condivisione; telefono → condivisione
// di sistema; PC → download.
function shareBinary(name, base64, mime, title) {
  var C = window.Capacitor;
  if (C && C.isNativePlatform && C.isNativePlatform() && C.nativePromise) {
    return C.nativePromise("Filesystem", "writeFile", { path: name, data: base64, directory: "CACHE" })
      .then(function (r) { return C.nativePromise("Share", "share", { title: title, url: r.uri, dialogTitle: title }); })
      .catch(function (err) { if (!/cancel/i.test((err && err.message) || "")) toast("Non è stato possibile salvare il file"); });
  }
  var bin = atob(base64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  var blob = new Blob([arr], { type: mime }), file = null;
  try { file = new File([blob], name, { type: mime }); } catch (e) {}
  var phone = window.matchMedia && matchMedia("(pointer: coarse)").matches;
  if (file && phone && navigator.canShare && navigator.canShare({ files: [file] })) {
    return navigator.share({ files: [file], title: title }).catch(function (err) { if (!err || err.name !== "AbortError") downloadBlob(name, blob); });
  }
  downloadBlob(name, blob);
  return Promise.resolve();
}
function downloadBlob(name, blob) {
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 30000);
  toast("File salvato: " + name, 2500);
}

// Carica un file: le rose del JSON vanno nella mia rosa (mia: true) o in quella dell'avversario
// con lo stesso nome; un file di testo va nella rosa aperta. I nomi già presenti non si duplicano.
function loadRosters(text, fname) {
  var data = null, entries;
  try { data = JSON.parse(text); } catch (e) {}
  if (data && Array.isArray(data.rose)) entries = data.rose;
  else if (data && Array.isArray(data.rosa)) {
    // rosa.json dell'app Convocazioni: { rosa: ["COGNOME NOME", …], predefiniti: { club, categoria, … } }
    var pd = data.predefiniti || {};
    entries = [{ squadra: S.settings.team || pd.club || "", mia: true, giocatori: data.rosa.map(function (x) { return titleCase(String(x)); }) }];
    var cc = {};
    ["club", "categoria", "competizione", "ritrovoOra", "ritrovoLuogo", "inizioOra", "impianto", "documenti", "kit", "puntualita", "assenze", "motto"].forEach(function (k) { if (pd[k]) cc[k] = String(pd[k]); });
    S.settings.conv = Object.assign({}, S.settings.conv, cc);
  }
  else if (data && Array.isArray(data.giocatori)) entries = [data];
  else {
    var opp = ui.rTab === "opp";
    var label = opp ? (ui.rOpp ? S.oppLabels[ui.rOpp] || ui.rOpp : String(fname || "").replace(/\.[^.]+$/, "").replace(/^rosa\s+/i, "")) : S.settings.team;
    entries = [{ squadra: label, mia: !opp, giocatori: splitNames(text) }];
  }
  var done = [];
  entries.forEach(function (r) {
    var label = String((r && r.squadra) || "").trim(), list;
    var names = ((r && r.giocatori) || []).map(function (x) { return String(x).trim(); }).filter(Boolean);
    if (r && r.mia) {
      list = S.settings.roster;
      if (!S.settings.team && label) S.settings.team = label;
      label = label || S.settings.team || "La mia squadra";
    } else {
      if (!label) return;
      var k = label.toLowerCase();
      if (!S.oppRosters[k]) S.oppRosters[k] = [];
      if (!S.oppLabels[k]) S.oppLabels[k] = label;
      list = S.oppRosters[k];
    }
    var n = 0;
    names.forEach(function (p) { if (list.indexOf(p) < 0) { list.push(p); n++; } });
    done.push(label + " +" + n);
  });
  save(); render();
  toast(done.length ? "Rose caricate: " + done.join(", ") : "Nel file non ci sono rose da caricare", 3500);
}

function makeMatchPdf(m) {

/* ---------- procedure guidate: gol, cartellini, sostituzioni ---------- */
// Una domanda per schermata, con il passo in corso e una riga di aiuto. Il minuto è quello del primo tocco.
// Il gol si registra subito (il minuto non si perde), cartellini e cambi alla conferma finale.

function startWizard(type, team) {

  ui.wz = { type: type, team: "", kind: "azione", card: "", player: "", off: "", on: "", period: m.period, sec: periodSec(m), eid: "" };
  ui.wzQ = "";
  if (team) { go("live", { sec: "w", step: "team" }); wzTeam(team); }
  else go("live", { sec: "w", step: "team" });
}
function wzEvent(m) { var w = ui.wz; return w && w.eid ? m.events.filter(function (x) { return x.id === w.eid; })[0] : null; }
function wzNext() {
  var steps = WZ_STEPS[ui.wz.type], i = steps.indexOf(ui.p.step);
  ui.wzQ = "";
  go("live", { sec: "w", step: steps[i + 1] });
}
function wzTeam(t) {
  var m = S.match, w = ui.wz;
  w.team = t;
  if (w.type === "goal" && !w.eid) {
    var e = { id: uid(), n: ++m.seq, type: "goal", team: t, period: w.period, sec: w.sec, player: "", kind: "azione" };
    m.events.push(e); w.eid = e.id; save();
    toast("Gol di " + teamName(m, t) + " registrato al " + minuteLabel(m, w.period, w.sec), 2500);
  }

}
// Squadra del giocatore da scegliere: nell'autogol è l'altra.
function wzPlayerTeam() { var w = ui.wz; return w.type === "goal" && w.kind === "autogol" ? other(w.team) : w.team; }

  if (e) { e[field] = v; save(); }
  wzNext();
}
function wzConfirm() {

  else {
    var e = { id: uid(), n: ++m.seq, type: w.type === "card" ? w.card : "sub", team: w.team, period: w.period, sec: w.sec, player: "", kind: "" };
    if (w.type === "sub") { e.on = w.on; e.off = w.off; msg = "Cambio salvato: entra " + (w.on || "?") + ", esce " + (w.off || "?"); }

// Eventi già inseriti di quel tipo, da correggere (tocco) o eliminare.

/* ---------- schermo acceso e segnale di fine tempo ---------- */
var wake = null, actx = null, beeped = false;
function holdWake() { try { if (navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(function (w) { wake = w; w.addEventListener("release", function () { wake = null; }); }).catch(function () {}); } catch (e) {} }
function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {} }
function whistle() {
  try {
    if (!actx) return;
    [0, .35, .7].forEach(function (d) {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.value = 2400;
      g.gain.setValueAtTime(.0001, actx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(.18, actx.currentTime + d + .02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d + .28);
      o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + .3);
    });
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
}

/* ---------- cronometro ---------- */
function tick() {
  var m = S.match;
  if (!m) return;
  var sec = periodSec(m), len = lenSec(m), base = (m.period - 1) * len;
  if (m.run && sec >= len && !m.beeped) { m.beeped = true; save(); whistle(); }
  if (ui.view !== "live") return;
  var $id = function (id) { return document.getElementById(id); };
  if ($id("clk")) {
    $id("clk").textContent = mmss(base + Math.min(sec, len));
    $id("extra").textContent = sec > len ? "+" + mmss(sec - len) : "";
    $id("cd").textContent = mmss(len - sec);
    $id("cdw").className = "cd" + (sec >= len ? " over" : "");
  }
  var pill = $id("pill"), pt = $id("pill-t");
  if (pill) {
    if (m.status === "break") { pill.className = "pill"; pt.textContent = T("Intervallo"); }
    else if (m.run) { pill.className = "pill " + (sec >= len ? "over" : "on"); pt.textContent = T(sec >= len ? "Recupero" : "In corso"); }
    else { pill.className = "pill"; pt.textContent = T(m.started ? "In pausa" : "Pronti"); }
  }
  var tg = $id("toggle");
  if (tg) tg.textContent = T(m.run ? "❚❚ Pausa" : m.started ? "▶ Riprendi" : "▶ Avvia");
}
setInterval(tick, 250);
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") { tick(); if (S.match && S.match.run) holdWake(); if (liveTarget()) livePush(); }
});

/* ---------- azioni ---------- */
// Modifiche alla formazione aperta nell'editor (ui.lmid, ui.luTeam).
function lineupAction(a, el) {
  var m = findMatch(ui.lmid), t = ui.luTeam, L = lineupOf(m, t), v = el.getAttribute("data-v");
  var roster = playersOf(m, t), toBench = function (n) { if (n && L.bench.indexOf(n) < 0) L.bench.push(n); };
  var fromBench = function (n) { L.bench = L.bench.filter(function (x) { return x !== n; }); };
  if (a === "lu-slot") { var si = +el.getAttribute("data-i"); ui.luSlot = ui.luSlot === si ? null : si; ui.luQ = ""; render(); return; }
  if (a === "lu-size" || a === "lu-mod") {
    L.mod = a === "lu-size" ? MODULI[v][0] : v;
    L.slots.slice(modSize(L.mod)).forEach(toBench);  // chi non ci sta più torna in panchina
    L.slots = fitSlots(L.slots, modSize(L.mod));
    if (ui.luSlot != null && ui.luSlot >= L.slots.length) ui.luSlot = null;
  }
  if (a === "lu-add") {
    v = (document.getElementById("lu-q").value || "").trim();  // solo dal pulsante "Aggiungi … alla rosa"
    if (!v) { document.getElementById("lu-q").focus(); return; }
    addToRoster(roster, v);
  }
  var was = L.slots.indexOf(v);
  if (a === "lu-pick" && ui.luSlot != null && was >= 0 && was !== ui.luSlot) {
    // giocatore già in campo: scambia i due ruoli
    L.slots[was] = L.slots[ui.luSlot]; L.slots[ui.luSlot] = v; ui.luSlot = null;
  } else if (a === "lu-pick" || a === "lu-add") {
    if (ui.luSlot == null) ui.luSlot = L.slots.indexOf("");
    if (ui.luSlot < 0) { ui.luSlot = null; toast("Tocca prima un ruolo sul campo"); return; }
    toBench(L.slots[ui.luSlot]);  // chi c'era torna in panchina
    fromBench(v);
    L.slots[ui.luSlot] = v;
    var next = L.slots.indexOf("");
    ui.luSlot = next >= 0 ? next : null; ui.luQ = "";
  }
  if (a === "lu-clear") { toBench(L.slots[ui.luSlot]); L.slots[ui.luSlot] = ""; }
  if (a === "lu-bench") { if (L.bench.indexOf(v) >= 0) fromBench(v); else toBench(v); }
  if (a === "lu-many") {
    var inp = document.getElementById("lu-new");
    splitNames(inp.value).forEach(function (n) { addToRoster(roster, n); if (L.slots.indexOf(n) < 0) toBench(n); });
  }
  rememberLineup(m, t); save(); render();
  if (a === "lu-many") { var again = document.getElementById("lu-new"); if (again) again.focus(); }
}
function openLineup(lm, lt) {
  if (!lineupOf(lm, lt)) setLineup(lm, lt, newLineup(lm, lt));
  var LL = lineupOf(lm, lt);
  if (!LL.bench) LL.bench = benchOf(lm, lt, LL).slice();
  ui.lmid = lm.id; ui.luTeam = lt; ui.luQ = "";
  var empty = LL.slots.indexOf("");
  ui.luSlot = empty >= 0 ? empty : null;
  save(); go("lineup");
}
function splitNames(s) { return s.split(/[,;\n]+/).map(function (x) { return x.trim(); }).filter(Boolean); }
function addToRoster(list, name) { if (list.indexOf(name) < 0) list.push(name); }

document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-a]");
  if (!el || el.disabled) return;
  var a = el.getAttribute("data-a"), m = S.match;
  var sm = ui.sheet && findMatch(ui.sheet.mid);
  var se = sm && sm.events.filter(function (x) { return x.id === ui.sheet.eid; })[0];

  switch (a) {
    case "back": back(); break;
    case "fwd": forward(); break;
    case "lang": S.settings.lang = el.getAttribute("data-v"); setLang(S.settings.lang); save(); render(); break;
    case "home": reset("home"); break;
    case "setup": planMatch(); go("plan"); break;
    case "plan": go("plan"); break;
    case "club": go("club"); break;
    case "resume": go("live"); break;
    case "roster": go("roster"); break;
    case "history": go("history"); break;
    case "r-go": go("roster", { sec: el.getAttribute("data-v") }); break;
    case "roster-open": {
      // dal foglio di un evento: apre la rosa di quella squadra; Indietro riporta all'evento
      var rm = findMatch(ui.sheet.mid), rt = el.getAttribute("data-t"), mineT = rt === rm.mySide;
      if (!mineT) { playersOf(rm, rt); ui.rOpp = oppKey(rm); }
      go("roster", { sec: mineT ? "mine" : "opp" }); break;
    }
    case "r-opp": ui.rOpp = el.getAttribute("data-v"); go("roster", { sec: "opp" }); break;
    case "r-oppnew": {
      var on = document.getElementById("r-oppname").value.trim();
      if (!on) { document.getElementById("r-oppname").focus(); break; }
      var ok = on.toLowerCase();
      if (!S.oppRosters[ok]) S.oppRosters[ok] = [];
      S.oppLabels[ok] = on; ui.rOpp = ok; save(); go("roster", { sec: "opp" });
      var rn = document.getElementById("r-new"); if (rn) rn.focus();
      break;
    }
    case "open": ui.id = el.getAttribute("data-id"); go("summary"); break;
    case "s-go": {
      var sv = el.getAttribute("data-v");
      go("summary", sv === "lineup" || sv === "fix" ? { sec: "team", act: sv } : { sec: sv }); break;
    }
    case "hub": {
      var hv = el.getAttribute("data-v");
      if (/^(goal|card|sub)$/.test(hv)) { unlockAudio(); startWizard(hv); break; }
      go("live", hv === "lineup" ? { sec: "team", act: hv } : { sec: hv }); break;
    }
    case "wz-team": wzTeam(el.getAttribute("data-t")); break;
    case "wz-kind": {
      var wk = el.getAttribute("data-v"), we = wzEvent(m);
      if ((wk === "autogol") !== (ui.wz.kind === "autogol")) { ui.wz.player = ""; if (we) we.player = ""; }
      ui.wz.kind = wk; if (we) { we.kind = wk; save(); }
      wzNext(); break;
    }
    case "wz-card": ui.wz.card = el.getAttribute("data-v"); wzNext(); break;
    case "wz-pick": wzSet(el.getAttribute("data-f"), el.getAttribute("data-v")); break;
    case "wz-new": {
      var wq = (document.getElementById("wz-q").value || "").trim(), wf = el.getAttribute("data-f");
      if (!wq) break;
      addToRoster(playersOf(m, wf === "player" ? wzPlayerTeam() : ui.wz.team), wq); save();
      wzSet(wf, wq); break;
    }
    case "wz-min": {
      ui.wz.sec = Math.max(0, ui.wz.sec + +el.getAttribute("data-d"));
      var wm = wzEvent(m); if (wm) { wm.sec = ui.wz.sec; save(); }
      render(); break;
    }
    case "wz-ok": wzConfirm(); break;
    case "wz-drop": {
      var wid = ui.wz.eid;
      ask("Eliminare questo gol?", "Il gol viene tolto dal risultato.", "Elimina il gol", function () {
        m.events = m.events.filter(function (x) { return x.id !== wid; }); save(); ui.wz = null;
        reset("live", {}, [{ view: "home", p: {} }]); toast("Gol eliminato");
      }, true);
      break;
    }
    case "ev-del2": {
      var did = el.getAttribute("data-id"), dm = S.match, de = dm.events.filter(function (x) { return x.id === did; })[0];
      var what2 = de.type === "sub" ? "il cambio" : de.type === "goal" ? "il gol" : de.type === "red" ? "l\u2019espulsione" : "l\u2019ammonizione";
      ask("Eliminare " + what2 + "?", minuteLabel(dm, de.period, de.sec) + " · " + teamName(dm, de.team) + ". L\u2019evento viene tolto dalla cronaca" + (de.type === "goal" ? " e dal risultato." : "."), "Elimina", function () {
        dm.events = dm.events.filter(function (x) { return x.id !== did; }); save(); render(); toast("Eliminato");
      }, true);
      break;
    }
    case "tp": {
      // squadra scelta per la formazione (partita) o per aggiungere un evento (riepilogo)
      var tt = el.getAttribute("data-t"), act = ui.p.act;
      if (act === "fix") { go("summary", { sec: "fixtype", t: tt }); break; }
      if (act === "lineup") { go(ui.view, { sec: "lineup", t: tt }); break; }
      break;
    }
    case "f-per": form.periods = Math.min(8, Math.max(1, form.periods + +el.getAttribute("data-d"))); render(); break;
    case "f-min": form.minutes = Math.min(90, Math.max(1, form.minutes + +el.getAttribute("data-d"))); render(); break;
    case "f-preset": form.minutes = +el.getAttribute("data-v"); render(); break;
    case "start": startMatch(m, form.periods, form.minutes); form = null; reset("live", {}, [{ view: "home", p: {} }]); break;
    case "p-go": {
      var pv = el.getAttribute("data-v");
      if (pv === "lineup") { ui.luNext = null; openLineup(m, m.mySide); break; }
      if (pv === "durata") form = null;
      go("plan", { step: pv }); break;
    }
    case "p-next": {
      var cur2 = el.getAttribute("data-v");
      if (cur2 === "opp") {
        var on2 = document.getElementById("p-opp").value.trim();
        if (!on2) { toast("Scrivi o scegli la squadra avversaria"); document.getElementById("p-opp").focus(); break; }
        setOpp(m, on2, m.mySide); save();
      }
      if (cur2 === "pdf") { reset("plan", {}, [{ view: "home", p: {} }]); break; }
      if (cur2 === "conv") { ui.luNext = "pdf"; openLineup(m, m.mySide); break; }
      go("plan", { step: PLAN_NEXT[cur2] }); break;
    }
    case "p-opp-pick": document.getElementById("p-opp").value = el.getAttribute("data-v"); setOpp(m, el.getAttribute("data-v"), m.mySide); save(); render(); break;
    case "p-side": { var po = document.getElementById("p-opp").value.trim(); setOpp(m, po || oppName(m), el.getAttribute("data-v")); save(); render(); break; }
    case "cv-set": if (cvSet(m, el.getAttribute("data-n"), el.getAttribute("data-v"))) { save(); render(); } break;
    case "cv-size": {
      var CL = m.lineup;
      CL.mod = MODULI[el.getAttribute("data-v")][0];
      CL.slots.slice(modSize(CL.mod)).forEach(function (n) { if (n && CL.bench.indexOf(n) < 0) CL.bench.push(n); });
      CL.slots = fitSlots(CL.slots, modSize(CL.mod)); rememberLineup(m, m.mySide); save(); render(); break;
    }
    case "p-az": m.plan.az = el.getAttribute("data-v") === "1"; save(); render(); break;
    case "p-pdf": makeConvPdf(m); break;
    case "m-pdf": makeMatchPdf(findMatch(el.getAttribute("data-mid"))); break;
    case "p-cancel":
      ask("Annullare la partita?", "Convocazione e dati della partita vengono cancellati. Rosa e formazione restano.", "Annulla la partita", function () {
        S.match = null; save(); reset("home");
      }, true);
      break;
    case "logo-del": setTeamInfo(el.getAttribute("data-k"), { logo: "" }); break;
    case "col-set": { var cp = {}; cp[el.getAttribute("data-w")] = el.getAttribute("data-v"); setTeamInfo(el.getAttribute("data-k"), cp); break; }

    case "r-add": {
      var inp = document.getElementById("r-new");
      splitNames(inp.value).forEach(function (n) { addToRoster(rosterList(), n); });
      save(); render();
      var again = document.getElementById("r-new"); if (again) again.focus();
      break;
    }
    case "r-del": rosterList().splice(+el.getAttribute("data-i"), 1); save(); render(); break;
    case "scan-open": ui.scan = { status: "idle" }; go("scan"); break;
    case "scan-paste": ui.scan = { status: "paste" }; render(); break;
    case "scan-reset": ui.scan = { status: "idle" }; render(); break;
    case "scan-parse": scanResult(document.getElementById("scan-text").value); break;
    case "scan-tog": {
      var si2 = +el.getAttribute("data-i"), sp = ui.scan.players[si2];
      ui.scan.players.forEach(function (p, i) { var inp = document.getElementById("scan-n" + i); if (inp) p.name = inp.value; });
      sp.on = !sp.on; render(); break;
    }
    case "scan-add": {
      var tgt = scanTarget(), added = 0;
      ui.scan.players.forEach(function (p, i) {
        var inp = document.getElementById("scan-n" + i), nm = ((inp && inp.value) || p.name).trim();
        if (p.on && nm && tgt.list.indexOf(nm) < 0) { tgt.list.push(nm); added++; }
      });
      ui.scan = null; save(); back(); toast(added + " giocatori aggiunti alla rosa di " + tgt.name, 3000); break;
    }
    case "r-save": saveRosters(false); break;
    case "r-saveall": saveRosters(true); break;

    case "toggle":
      unlockAudio();
      if (m.run) { stopClock(m); releaseWake(); }
      else { m.run = Date.now(); m.started = true; holdWake(); }
      save(); tick(); break;
    case "adj": {
      var d = +el.getAttribute("data-d") * 1000;
      var cur = m.acc + (m.run ? Date.now() - m.run : 0);
      m.acc += Math.max(-cur, d);
      if (periodSec(m) < lenSec(m)) m.beeped = false;
      save(); tick(); break;
    }
    case "goal": unlockAudio(); startWizard("goal", el.getAttribute("data-t")); break;
    case "end-period": {
      var last = m.period >= m.periods;
      ask(last ? "Fine partita?" : "Fine " + periodName(m.period, m.periods) + "?",
        last ? "Il cronometro si ferma e vedi il risultato finale con i marcatori." : "Il cronometro si ferma. Riparti quando inizia il " + periodName(m.period + 1, m.periods) + ".",
        last ? "Chiudi partita" : "Fine tempo",
        function () {
          if (last) return finishMatch();
          stopClock(m); m.status = "break"; releaseWake(); save(); reset("live", {}, [{ view: "home", p: {} }]);
        });
      break;
    }
    case "next-period":
      unlockAudio();
      m.period++; m.acc = 0; m.run = Date.now(); m.status = "play"; m.beeped = false; m.started = true;
      holdWake(); save(); reset("live", {}, [{ view: "home", p: {} }]); break;
    case "end-match":
      ask("Terminare la partita?", "La partita viene chiusa adesso con il risultato attuale (" + score(m, "home") + "-" + score(m, "away") + ").", "Termina", finishMatch, true);
      break;

    case "edit": ui.sheet = { mid: el.getAttribute("data-mid"), eid: el.getAttribute("data-id"), fresh: false }; ui.newPlayer = {}; renderLayer(); break;
    case "kind": {
      var before = playerTeam(se);
      se.kind = el.getAttribute("data-v");
      if (playerTeam(se) !== before) se.player = "";
      save(); render(); break;
    }
    case "pick": se[el.getAttribute("data-f") || "player"] = el.getAttribute("data-v"); save(); render(); break;
    case "pick-new": {
      var fld = el.getAttribute("data-f") || "player";
      var np = document.getElementById("new-" + fld), name = np.value.trim();
      if (!name) { np.focus(); break; }
      addToRoster(playersOf(sm, playerTeam(se)), name);
      se[fld] = name; ui.newPlayer[fld] = ""; save(); render(); break;
    }
    case "ev-min": se.sec = Math.max(0, se.sec + +el.getAttribute("data-d")); save(); render(); break;
    case "ev-team": {
      // evento registrato sulla squadra sbagliata: lo sposta sull'altra; i giocatori scelti erano dell'altra rosa
      var pBefore = playerTeam(se);
      se.team = other(se.team);
      if (playerTeam(se) !== pBefore) { se.player = ""; if (se.type === "sub") { se.on = ""; se.off = ""; } }
      save(); render(); toast("Assegnato a " + teamName(sm, se.team)); break;
    }
    case "past-add": addEvent(el.getAttribute("data-c"), el.getAttribute("data-t"), findMatch(ui.id)); break;
    case "ev-del": {
      var id = se.id;
      sm.events = sm.events.filter(function (x) { return x.id !== id; });
      ui.sheet = null; save(); render(); toast("Evento eliminato"); break;
    }
    case "sheet-close": ui.sheet = null; render(); break;

    case "c-yes": { var fn = ui.confirm.fn; ui.confirm = null; renderLayer(); fn(); break; }
    case "c-no": ui.confirm = null; renderLayer(); break;

    case "copy": copyText(resultText(findMatch(ui.id)), "Risultato copiato"); break;
    case "share": shareText(resultText(findMatch(ui.id)), "Condividi il risultato"); break;
    case "live-on": m.live = { topic: liveTopic() }; save(); render(); break;
    case "live-copy": copyText(liveURL(liveTarget()), "Link copiato"); break;
    case "live-share": {
      var lm = liveTarget();
      shareText(L("Segui in diretta ", "Follow live: ") + lm.home + " - " + lm.away + ": " + liveURL(lm), "Condividi la diretta");
      break;
    }
    case "share-close": ui.share = null; renderLayer(); break;

    case "lu-open": { var lm = findMatch(el.getAttribute("data-mid")); ui.luNext = null; openLineup(lm, el.getAttribute("data-t") || lm.mySide); break; }
    case "lu-done":
      ui.luSlot = null;
      if (ui.luNext) { var nx = ui.luNext; ui.luNext = null; go("plan", { step: nx }); } else back();
      break;
    case "lu-size": case "lu-mod": case "lu-slot": case "lu-pick": case "lu-add": case "lu-clear": case "lu-bench": case "lu-many":
      lineupAction(a, el); break;
    case "del-match":
      ask("Eliminare la partita?", "Il risultato e la cronaca vengono cancellati da questo telefono.", "Elimina", function () {
        S.history = S.history.filter(function (x) { return x.id !== ui.id; }); save(); reset("history", {}, [{ view: "home", p: {} }]);
      }, true);
      break;
  }
});

document.addEventListener("input", function (ev) {
  var id = ev.target.id;
  if (/^new-/.test(id)) { ui.newPlayer[id.slice(4)] = ev.target.value; filterChips(id.slice(4), ev.target.value); }
  if (id === "lu-q") { ui.luQ = ev.target.value; filterChips("lu", ev.target.value); }
  if (id === "wz-q") { ui.wzQ = ev.target.value; filterChips("wz", ev.target.value); }
  if (/^p-f-/.test(id) && S.match && S.match.plan) { S.match.plan[id.slice(4)] = ev.target.value; save(); }
  if (/^c-/.test(id) && id !== "c-logo-file" && !/^col-/.test(id)) { var cs = {}; cs[id.slice(2)] = ev.target.value; S.settings.conv = Object.assign({}, S.settings.conv, cs); save(); }
});
// Invio: se la ricerca trova un solo nome lo sceglie. Un nome nuovo si aggiunge solo col pulsante.
function enterPick(key) {
  var box = document.querySelector('[data-picker="' + key + '"]');
  var hits = box ? Array.prototype.filter.call(box.querySelectorAll(".grp .chip[data-v]"), function (c) { return !c.hidden; }) : [];
  if (hits.length === 1) hits[0].click();
}
document.addEventListener("change", function (ev) {
  if (ev.target.id === "r-team") { S.settings.team = ev.target.value.trim(); save(); }
  if (/^[co]-logo-file$/.test(ev.target.id) && ev.target.files && ev.target.files[0]) { loadLogo(ev.target.files[0], ev.target.id.charAt(0)); ev.target.value = ""; }
  var cm = /^col-([co])-(primary|secondary)$/.exec(ev.target.id);
  if (cm) { var cc2 = {}; cc2[cm[2]] = ev.target.value.toUpperCase(); setTeamInfo(cm[1], cc2); }
  if (ev.target.id === "scan-file" && ev.target.files && ev.target.files[0]) { readPhoto(ev.target.files[0]); ev.target.value = ""; }
  if (ev.target.id === "r-file" && ev.target.files && ev.target.files[0]) {
    var f = ev.target.files[0], rd = new FileReader();
    rd.onload = function () { loadRosters(String(rd.result || ""), f.name); };
    rd.onerror = function () { toast("Non riesco a leggere il file"); };
    rd.readAsText(f);
    ev.target.value = "";
  }
  if (ev.target.id === "ev-minute" && ui.sheet) {
    var mm = findMatch(ui.sheet.mid), ee = mm && mm.events.filter(function (x) { return x.id === ui.sheet.eid; })[0];
    if (ee && setMinute(mm, ee, ev.target.value)) { save(); render(); } else toast("Scrivi il minuto, es. 38 o 45+2");
  }
});
document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Enter") return;
  var id = ev.target.id;
  if (id === "r-new") { ev.preventDefault(); document.querySelector('[data-a="r-add"]').click(); }
  if (/^new-/.test(id) && ev.target.value.trim()) { ev.preventDefault(); enterPick(id.slice(4)); }
  if (id === "lu-q" && ev.target.value.trim()) { ev.preventDefault(); enterPick("lu"); }
  if (id === "wz-q" && ev.target.value.trim()) { ev.preventDefault(); enterPick("wz"); }
  if (id === "r-oppname") { ev.preventDefault(); document.querySelector('[data-a="r-oppnew"]').click(); }
  if (id === "lu-new") { ev.preventDefault(); document.querySelector('[data-a="lu-many"]').click(); }
  if (id === "r-team" || id === "ev-minute") ev.target.blur();
});

render();
if (S.match && S.match.run) holdWake();
// Tasto "indietro" di Android: chiude il foglio aperto o torna al menu; 0 = lascia uscire dall'app.
window.bcBack = function () {
  if (ui.confirm || ui.share || ui.sheet) { ui.confirm = null; ui.share = null; ui.sheet = null; render(); return 1; }
  if (ui.view !== "home") { ui.luSlot = null; back(); return 1; }
  return 0;
};
if (liveTarget()) livePush();
window.addEventListener("online", function () { if (liveTarget()) livePush(); });

try {
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor) navigator.serviceWorker.register("sw.js").catch(function () {});
} catch (e) {}
})();
</script>
</body>
</html>
