<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bordocampo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bordocampo">
<meta name="theme-color" content="#0d1912">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: una colonna da telefono; il tabellone scuro in alto resta sempre leggibile a bordocampo, sotto comandi e cronologia. */
:root {
  --bg: #e9efea;
  --surface: #ffffff;
  --ink: #0f1a14;
  --muted: #5a6a61;
  --line: #d3ddd6;
  --accent: #13804a;
  --accent-ink: #ffffff;
  --board: #0d1912;
  --board-2: #15251b;
  --board-ink: #f1f6f2;
  --board-muted: #8fa597;
  --led: #ffcf3a;
  --yellow: #f2c200;
  --red: #d7263d;
  --danger: #b3192d;
  --ball: #ffffff;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08100b; --surface: #111c15; --ink: #e7efe9; --muted: #92a398; --line: #233229;
    --accent: #2fbf71; --accent-ink: #04130a; --board: #050a07; --board-2: #0f1b13;
    --board-ink: #f1f6f2; --board-muted: #8fa597; --led: #ffcf3a; --danger: #ff5a6e; --ball: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08100b; --surface: #111c15; --ink: #e7efe9; --muted: #92a398; --line: #233229;
  --accent: #2fbf71; --accent-ink: #04130a; --board: #050a07; --board-2: #0f1b13;
  --board-ink: #f1f6f2; --board-muted: #8fa597; --led: #ffcf3a; --danger: #ff5a6e; --ball: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--board); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.tabnum { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* barra superiore */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
.top .title { font-family: var(--font-display); font-weight: 800; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; }
.link { color: var(--accent); font-weight: 600; padding: 8px 4px; }
.link.danger { color: var(--danger); }

/* pulsanti */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 18px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 17px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.big { min-height: 64px; font-size: 20px; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1; }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 2px; text-align: left; width: 100%; }
.item .grow { min-width: 0; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 8px 2px; }

/* form */
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; color: var(--muted); }
input[type=text] {
  width: 100%; min-height: 50px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 17px;
}
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { min-height: 44px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 50px; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 26px; font-weight: 500; }
.stepper .v { font-family: var(--font-display); font-size: 34px; font-weight: 700; min-width: 64px; text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-size: 15px; }
.chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* tabellone */
.board {
  background: var(--board); color: var(--board-ink); border-radius: 20px;
  padding: 16px 14px 18px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
}
.board-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: 15px; color: var(--board-muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--board-muted); }
.pill.on { color: #5fe39a; }
.pill.on .dot { background: #5fe39a; animation: blink 1.2s infinite; }
.pill.over { color: var(--led); }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.on .dot { animation: none; } }
.clockwrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.clock { font-family: var(--font-display); font-weight: 700; font-size: 84px; line-height: .95; color: var(--led); font-variant-numeric: tabular-nums; letter-spacing: .01em; display: flex; align-items: baseline; gap: 10px; }
.clock .extra { font-size: 34px; color: var(--led); }
.cd { font-family: var(--font-display); font-size: 20px; color: var(--board-muted); text-transform: uppercase; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.cd b { color: var(--board-ink); font-size: 26px; font-weight: 700; letter-spacing: .02em; }
.cd.over b { color: var(--red); }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 6px; }
.team { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.tname-row { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; }
.tname { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; text-align: center; line-height: 1.05; overflow-wrap: anywhere; min-width: 0; }
.tname .mine { display: block; font-size: 12px; color: var(--board-muted); letter-spacing: .1em; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 76px; line-height: 1; font-variant-numeric: tabular-nums; }
.vs { font-family: var(--font-display); font-size: 48px; color: var(--board-muted); padding-top: 64px; }
.ball {
  flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
  background: var(--board-2); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14);
}
.ball svg { width: 40px; height: 40px; }
.ball:active { transform: scale(.92); background: var(--accent); }
.ball[disabled] { opacity: .35; }
.ballsvg .w { fill: var(--ball); }
.ballsvg .k { fill: #101512; }
.ballsvg .s, .ballsvg .ring { stroke: #101512; }
.cardbtns { display: flex; gap: 10px; }
.cardbtn { width: 44px; height: 50px; display: grid; place-items: center; border-radius: 10px; background: var(--board-2); }
.cardbtn i { display: block; width: 20px; height: 28px; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.5); }
.cardbtn.y i { background: var(--yellow); }
.cardbtn.r i { background: var(--red); }
.cardbtn:active { transform: scale(.92); }
.cardbtn[disabled] { opacity: .35; }
.cardbtn.s svg { width: 26px; height: 26px; }
.subsvg .up { stroke: #5fe39a; }
.subsvg .down { stroke: #ff6b7d; }
.ico .subsvg .up { stroke: var(--accent); }
.ico .subsvg .down { stroke: var(--danger); }
.who .on, .who .off { display: block; }
.who .on::before, .who .off::before { display: inline-block; width: 1.1em; font-size: .8em; }
.who .on::before { content: "\25B2"; color: var(--accent); }
.who .off::before { content: "\25BC"; color: var(--danger); }
.who .off { font-weight: 500; color: var(--muted); }

/* comandi partita */
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.controls .span { grid-column: 1 / -1; }
.adj { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.adj button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; }
.adj-label { font-size: 13px; color: var(--muted); text-align: center; }

/* cronologia */
.tl { display: flex; flex-direction: column; }
.tl-period { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; padding: 10px 2px 6px; border-bottom: 1px solid var(--line); }
.ev { display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.ev .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ev .side.r { flex-direction: row-reverse; text-align: right; }
.ev .who { font-weight: 600; overflow-wrap: break-word; min-width: 0; }
.ev .who small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }
.ev .min { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.ico { flex: none; width: 22px; height: 22px; display: grid; place-items: center; }
.ico svg { width: 22px; height: 22px; }
.ico .card { width: 14px; height: 19px; border-radius: 2px; }
.ico .card.y { background: var(--yellow); }
.ico .card.r { background: var(--red); }
.ico .card.yr { background: linear-gradient(135deg, var(--yellow) 50%, var(--red) 50%); }
.ballsvg.inline .w { fill: var(--surface); }
.ballsvg.inline .k { fill: var(--ink); }
.ballsvg.inline .s { stroke: var(--ink); }
.ballsvg.inline .ring { stroke: var(--ink); }

/* foglio inferiore */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 88vh; overflow-y: auto;
  background: var(--surface); border-radius: 22px 22px 0 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto;
  animation: up .18s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.sh-head { display: flex; align-items: center; gap: 10px; }
.sh-head h3 { font-size: 26px; font-weight: 800; text-transform: uppercase; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sh-head .bigmin { font-family: var(--font-display); font-size: 34px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.sh-foot { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.note { font-size: 14px; color: var(--muted); }

/* riepilogo */
.final .scoreline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.final .score { font-size: 72px; }
.final .partials { text-align: center; color: var(--board-muted); font-family: var(--font-display); letter-spacing: .06em; font-size: 16px; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.scorers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; color: var(--board-ink); }
.scorers > div { min-width: 0; overflow-wrap: anywhere; }
.scorers .r { text-align: right; }
.scorers p { margin: 0 0 4px; }
.textout { width: 100%; min-height: 160px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 12px; font: 15px/1.45 var(--font-body); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 40; }

/* diretta */
.live-link { font: 600 15px/1.3 var(--font-body); min-height: 46px; }
.live-st { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.live-st .dot { flex: none; }
.live-st.ok .dot { background: var(--accent); }
.live-st.err { color: var(--danger); }
.live-st.err .dot { background: var(--danger); }

@media (max-width: 380px) {
  .clock { font-size: 70px; }
  .score { font-size: 64px; }
  .tname { font-size: 17px; }
  .ball { width: 50px; height: 50px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script>
(function () {
"use strict";

/* ---------- dati ---------- */
var KEY = "bordocampo-v1";
var S = load();
function fresh() { return { settings: { team: "", roster: [], periods: 2, minutes: 45, side: "home" }, match: null, history: [] }; }
function load() {
  var d = fresh();
  try {
    var raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && typeof raw === "object") {
      if (raw.settings) Object.assign(d.settings, raw.settings);
      d.match = raw.match || null;
      d.history = Array.isArray(raw.history) ? raw.history : [];
    }
  } catch (e) {}
  return d;
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function save() { store(); liveSchedule(); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

var ui = { view: S.match ? "live" : "home", id: null, sheet: null, confirm: null, share: null, newPlayer: {} };

/* ---------- tempo ---------- */
// m.acc = millisecondi già giocati nel tempo corrente, m.run = timestamp di quando il cronometro è ripartito (null = fermo).
// Calcolare dal timestamp fa sì che il tempo resti giusto anche se l'iPhone blocca lo schermo.
function periodSec(m) { return Math.floor((m.acc + (m.run ? Date.now() - m.run : 0)) / 1000); }
function lenSec(m) { return m.minutes * 60; }
function two(n) { return (n < 10 ? "0" : "") + n; }
function mmss(sec) { sec = Math.max(0, sec); return two(Math.floor(sec / 60)) + ":" + two(sec % 60); }
// Minuto calcistico: 0:00-0:59 è il 1', a fine tempo si passa a 45+1', 45+2'...
function minuteLabel(m, period, sec) {
  var len = lenSec(m), base = (period - 1) * m.minutes;
  if (sec < len) return (base + Math.floor(sec / 60) + 1) + "′";
  return (base + m.minutes) + "+" + (Math.floor((sec - len) / 60) + 1) + "′";
}
function periodName(n) { return n + "° tempo"; }

/* ---------- partita ---------- */
function other(t) { return t === "home" ? "away" : "home"; }
function teamName(m, t) { return m[t] || (t === "home" ? "Casa" : "Ospiti"); }
function sorted(m) { return m.events.slice().sort(function (a, b) { return a.period - b.period || a.sec - b.sec || a.n - b.n; }); }
function score(m, t, upto) { return m.events.filter(function (e) { return e.type === "goal" && e.team === t && (!upto || e.period <= upto); }).length; }
// Squadra del giocatore coinvolto: nell'autogol il giocatore è della squadra avversaria.
function playerTeam(e) { return e.type === "goal" && e.kind === "autogol" ? other(e.team) : e.team; }
function playersOf(m, t) {
  if (t === m.mySide) return S.settings.roster;
  if (!m.opp) m.opp = [];
  return m.opp;
}
function secondYellow(m, e) {
  if (e.type !== "yellow" || !e.player) return false;
  var list = sorted(m), i = list.indexOf(e);
  for (var k = 0; k < i; k++) if (list[k].type === "yellow" && list[k].team === e.team && list[k].player === e.player) return true;
  return false;
}
function findMatch(id) {
  if (S.match && S.match.id === id) return S.match;
  for (var i = 0; i < S.history.length; i++) if (S.history[i].id === id) return S.history[i];
  return null;
}
function stopClock(m) { if (m.run) { m.acc += Date.now() - m.run; m.run = null; } }

function newMatch(f) {
  var mine = f.team.trim() || "La mia squadra", opp = f.opp.trim() || "Avversari";
  S.settings.team = mine; S.settings.periods = f.periods; S.settings.minutes = f.minutes; S.settings.side = f.side;
  S.match = {
    id: uid(), date: new Date().toISOString(),
    home: f.side === "home" ? mine : opp, away: f.side === "home" ? opp : mine, mySide: f.side,
    periods: f.periods, minutes: f.minutes, period: 1, acc: 0, run: null, status: "play", started: false,
    events: [], opp: [], seq: 0
  };
  save();
}
function addEvent(type, team) {
  var m = S.match;
  if (!m || m.status !== "play") return;
  var e = { id: uid(), n: ++m.seq, type: type, team: team, period: m.period, sec: periodSec(m), player: "", kind: type === "goal" ? "azione" : "" };
  if (type === "sub") { e.on = ""; e.off = ""; }
  m.events.push(e);
  save();
  ui.sheet = { mid: m.id, eid: e.id, fresh: true };
  ui.newPlayer = {};
  render();
}
function finishMatch() {
  var m = S.match;
  stopClock(m);
  m.status = "ended";
  m.ended = new Date().toISOString();
  S.history.unshift(m);
  S.match = null;
  save();
  releaseWake();
  ui = { view: "summary", id: m.id, sheet: null, confirm: null, share: null, newPlayer: {} };
  render();
  liveSchedule();
}

/* ---------- testo del risultato ---------- */
function kindTag(e) { return e.kind === "rigore" ? " (rig.)" : e.kind === "autogol" ? " (aut.)" : ""; }
function scorersOf(m, t) {
  var groups = [], byName = {};
  sorted(m).forEach(function (e) {
    if (e.type !== "goal" || e.team !== t) return;
    var name = e.player || "Marcatore non indicato";
    if (!byName[name]) { byName[name] = { name: name, mins: [] }; groups.push(byName[name]); }
    byName[name].mins.push(minuteLabel(m, e.period, e.sec) + kindTag(e));
  });
  return groups.map(function (g) { return g.name + " " + g.mins.join(", "); });
}
function cardsOf(m, kind) {
  return sorted(m).filter(function (e) {
    if (kind === "yellow") return e.type === "yellow" && !secondYellow(m, e);
    return e.type === "red" || secondYellow(m, e);
  }).map(function (e) {
    return (e.player || "Giocatore non indicato") + " (" + teamName(m, e.team) + ") " + minuteLabel(m, e.period, e.sec) + (secondYellow(m, e) ? " doppia amm." : "");
  });
}
// Cambi, es. "Aurora 55′: entra Bianchi, esce Rossi"
function subsOf(m) {
  return sorted(m).filter(function (e) { return e.type === "sub"; }).map(function (e) {
    return teamName(m, e.team) + " " + minuteLabel(m, e.period, e.sec) + ": entra " + (e.on || "non indicato") + ", esce " + (e.off || "non indicato");
  });
}
function partials(m) {
  var out = [];
  for (var p = 1; p <= m.periods; p++) out.push(p + "°T " + score(m, "home", p) + "-" + score(m, "away", p));
  return out;
}
function dateLabel(iso) {
  try { return new Date(iso).toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "long", year: "numeric" }); } catch (e) { return ""; }
}
function resultText(m) {
  var L = [];
  L.push(teamName(m, "home") + " " + score(m, "home") + " - " + score(m, "away") + " " + teamName(m, "away"));
  L.push(dateLabel(m.date) + " · " + m.periods + " tempi da " + m.minutes + "'");
  if (m.periods > 1) L.push("Parziali: " + partials(m).join(" · "));
  ["home", "away"].forEach(function (t) {
    var s = scorersOf(m, t);
    if (s.length) L.push("", "⚽ " + teamName(m, t) + ":", s.join("\n"));
  });
  var y = cardsOf(m, "yellow"), r = cardsOf(m, "red");
  if (y.length) L.push("", "🟨 Ammoniti:", y.join("\n"));
  if (r.length) L.push("", "🟥 Espulsi:", r.join("\n"));
  var c = subsOf(m);
  if (c.length) L.push("", "🔁 Cambi:", c.join("\n"));
  return L.join("\n");
}

/* ---------- diretta ---------- */
// La diretta passa da ntfy.sh (servizio di messaggi gratuito, senza account): a ogni modifica
// l'app pubblica lo stato della partita su un canale con nome casuale, e la pagina diretta.html
// lo legge in tempo reale. ntfy.sh conserva i messaggi per 12 ore.
var NTFY = "https://ntfy.sh/";
var PAGES = "https://alessandromex.github.io/INFORMATICA/partita/";
var liveTimer = null, liveRetry = null;
function liveTopic() {
  var a = new Uint8Array(16), out = "bordocampo-";
  try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < a.length; i++) a[i] = Math.random() * 256; }
  for (var k = 0; k < a.length; k++) out += "abcdefghijkmnpqrstuvwxyz23456789"[a[k] % 32];
  return out;
}
function liveURL(m) {
  var base = /github\.io$/.test(location.hostname) ? new URL("diretta.html", location.href).href.split("?")[0] : PAGES + "diretta.html";
  return base + "?id=" + m.live.topic;
}
function snap(m) {
  return {
    v: 1, h: m.home, a: m.away, s: m.mySide, P: m.periods, M: m.minutes, pe: m.period, st: m.status,
    sd: m.started ? 1 : 0, p: m.acc + (m.run ? Date.now() - m.run : 0), r: m.run ? 1 : 0, t: Date.now(), d: m.date,
    e: sorted(m).map(function (e) {
      // nel cambio chi esce va in [4] e chi entra in [6]
      if (e.type === "sub") return ["s", e.team === "home" ? 0 : 1, e.period, e.sec, e.off || "", "", e.on || ""];
      return [e.type[0], e.team === "home" ? 0 : 1, e.period, e.sec, e.player || "", e.kind === "rigore" ? "r" : e.kind === "autogol" ? "o" : ""];
    })
  };
}
function liveTarget() {
  if (S.match && S.match.live) return S.match;
  if (ui.view === "summary") { var m = findMatch(ui.id); if (m && m.live) return m; }
  return null;
}
function liveSchedule() { if (liveTarget()) { clearTimeout(liveTimer); liveTimer = setTimeout(livePush, 700); } }
function livePush() {
  var m = liveTarget();
  if (!m) return;
  clearTimeout(liveRetry);
  m.live.state = "sending"; liveStatus();
  fetch(NTFY + m.live.topic, { method: "POST", body: JSON.stringify(snap(m)) })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      m.live.state = "ok"; m.live.sent = Date.now(); store(); liveStatus();
    })
    .catch(function () {
      m.live.state = "err"; liveStatus();
      liveRetry = setTimeout(livePush, 15000);
    });
}
function liveStatusText(m) {
  if (m.live.state === "err") return "Nessuna connessione: riprovo tra poco. La partita resta salvata sul telefono.";
  if (m.live.state === "sending") return "Invio aggiornamento…";
  if (m.live.sent) return "Aggiornata alle " + new Date(m.live.sent).toLocaleTimeString("it-IT");
  return "In attesa del primo invio";
}
function liveStatus() {
  var el = document.getElementById("live-st"), m = liveTarget();
  if (!el || !m) return;
  el.className = "live-st " + (m.live.state || "");
  el.lastChild.textContent = liveStatusText(m);
}
function livePanel(m) {
  if (!m.live) {
    return '<section class="panel"><h2>Diretta per i genitori</h2>' +
      '<div class="note">Crea un link da mandare nel gruppo della squadra: chi lo apre vede risultato, minuto e marcatori in tempo reale, senza installare niente.</div>' +
      '<button class="btn primary block" data-a="live-on">Crea link della diretta</button></section>';
  }
  return '<section class="panel"><h2>Diretta per i genitori</h2>' +
    '<input type="text" class="live-link" id="live-link" readonly value="' + esc(liveURL(m)) + '" aria-label="Link della diretta">' +
    '<div class="controls"><button class="btn primary" data-a="live-copy">Copia link</button><button class="btn" data-a="live-share">Condividi</button></div>' +
    '<div class="live-st ' + (m.live.state || "") + '" id="live-st"><i class="dot"></i><span>' + esc(liveStatusText(m)) + "</span></div>" +
    '<div class="note">Il link resta attivo per 12 ore dall’ultimo aggiornamento.</div></section>';
}

/* ---------- condivisione ---------- */
// Nell'app Android usa il pannello di condivisione di sistema (plugin Share di Capacitor),
// nel browser la Web Share API, altrimenti mostra il testo da copiare.
function shareText(text, title) {
  var show = function () { ui.share = text; renderLayer(); };
  try {
    var C = window.Capacitor;
    if (C && C.isNativePlatform && C.isNativePlatform() && C.nativePromise) {
      C.nativePromise("Share", "share", { text: text, dialogTitle: title || "Condividi" }).catch(show);
      return;
    }
    if (navigator.share) {
      navigator.share({ text: text }).catch(function (err) { if (!err || err.name !== "AbortError") show(); });
      return;
    }
  } catch (e) {}
  show();
}
function copyText(text, done) {
  var fallback = function () { ui.share = text; renderLayer(); };
  try { navigator.clipboard.writeText(text).then(function () { toast(done); }, fallback); } catch (e) { fallback(); }
}

function ballSVG(cls) {
  return '<svg class="ballsvg ' + (cls || "") + '" viewBox="0 0 40 40" aria-hidden="true">' +
    '<circle class="w ring" cx="20" cy="20" r="18" stroke-width="2"/>' +
    '<path class="k" d="M20 11.5l7.6 5.5-2.9 9h-9.4l-2.9-9z"/>' +
    '<path class="s" fill="none" stroke-width="2" d="M20 11.5V4M27.6 17l7.2-2.4M24.7 26l4.4 6.2M15.3 26l-4.4 6.2M12.4 17l-7.2-2.4"/>' +
    '<path class="k" d="M20 2.2l4.6 2.3-4.6 2.6-4.6-2.6zM37.6 14.6l-.4 5.4-3.9-2.6.9-4.6zM31.2 34.4l-5.1 1.6 1-4.6 4.7-.9zM8.8 34.4l5.1 1.6-1-4.6-4.7-.9zM2.4 14.6l.4 5.4 3.9-2.6-.9-4.6z"/>' +
    '</svg>';
}
function subSVG() {
  return '<svg class="subsvg" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path class="up" d="M8 20V5M3.5 9.5L8 5l4.5 4.5"/><path class="down" d="M16 4v15M11.5 14.5L16 19l4.5-4.5"/></svg>';
}
function evIcon(m, e) {
  if (e.type === "sub") return '<span class="ico">' + subSVG() + "</span>";
  if (e.type === "goal") return '<span class="ico">' + ballSVG("inline") + "</span>";
  if (e.type === "red") return '<span class="ico"><i class="card r"></i></span>';
  return '<span class="ico"><i class="card ' + (secondYellow(m, e) ? "yr" : "y") + '"></i></span>';
}
function evText(m, e) {
  if (e.type === "sub") {
    if (!e.on && !e.off) return '<span class="who">Cambio<small>giocatori non indicati</small></span>';
    return '<span class="who"><span class="on">' + esc(e.on || "non indicato") + '</span><span class="off">' + esc(e.off || "non indicato") + "</span></span>";
  }
  var sub;
  if (e.type === "goal") sub = e.kind === "rigore" ? "Rigore" : e.kind === "autogol" ? "Autogol" : "Gol";
  else if (e.type === "red") sub = "Espulsione";
  else sub = secondYellow(m, e) ? "2ª ammonizione, espulso" : "Ammonizione";
  if (!e.player) return '<span class="who">' + sub + "<small>" + (e.type === "goal" ? "marcatore non indicato" : "giocatore non indicato") + "</small></span>";
  return '<span class="who">' + esc(e.player) + "<small>" + sub + "</small></span>";
}

function timeline(m) {
  var list = sorted(m);
  if (!list.length) return '<div class="empty">Tocca il pallone accanto a una squadra per segnare un gol: il minuto viene registrato subito, i dettagli puoi aggiungerli dopo.</div>';
  var h = "", cur = 0;
  list.forEach(function (e) {
    if (e.period !== cur) {
      cur = e.period;
      if (m.periods > 1) h += '<div class="tl-period"><span>' + periodName(cur) + "</span></div>";
    }
    var side = '<span class="side' + (e.team === "away" ? " r" : "") + '">' + evIcon(m, e) + evText(m, e) + "</span>";
    h += '<button class="ev" data-a="edit" data-mid="' + m.id + '" data-id="' + e.id + '">' +
      (e.team === "home" ? side : "<span></span>") +
      '<span class="min">' + minuteLabel(m, e.period, e.sec) + "</span>" +
      (e.team === "away" ? side : "<span></span>") + "</button>";
  });
  return h;
}

  if (ui.sheet) {

    h += '<div class="scrim" data-a="c-no"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' +
      '<div class="sh-head"><h3>' + esc(ui.confirm.title) + "</h3></div>" +
      (ui.confirm.text ? '<div class="note">' + esc(ui.confirm.text) + "</div>" : "") +
      '<div class="sh-foot"><button class="btn" data-a="c-no">Annulla</button><button class="btn ' + (ui.confirm.danger ? "danger" : "primary") + '" data-a="c-yes">' + esc(ui.confirm.ok) + "</button></div></div>";
  }
  if (ui.share) {
    h += '<div class="scrim" data-a="share-close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' +
      '<div class="sh-head"><h3>Risultato</h3></div><div class="note">Il testo è selezionato: copialo e incollalo dove vuoi.</div>' +
      '<textarea class="textout" id="share-text" readonly>' + esc(ui.share) + "</textarea>" +
      '<button class="btn primary block" data-a="share-close">Chiudi</button></div>';
  }
  layer.innerHTML = h;
  var ta = document.getElementById("share-text");
  if (ta) { ta.focus(); ta.select(); }
}

// Nomi da toccare + campo per un nome nuovo; field è la proprietà dell'evento da riempire.
function pickerHTML(e, field, label, names) {
  var cur = e[field] || "";
  return "<h2>" + label + "</h2>" +
    '<div class="chips"><button class="chip" data-a="pick" data-f="' + field + '" data-v="" aria-pressed="' + (!cur) + '">Non indicato</button>' +
    names.map(function (p) { return '<button class="chip" data-a="pick" data-f="' + field + '" data-v="' + esc(p) + '" aria-pressed="' + (cur === p) + '">' + esc(p) + "</button>"; }).join("") + "</div>" +
    '<div class="row"><input type="text" id="new-' + field + '" class="grow" autocomplete="off" placeholder="Nuovo nome" value="' + esc(ui.newPlayer[field] || "") + '">' +
    '<button class="btn" data-a="pick-new" data-f="' + field + '">Aggiungi</button></div>';
}
function sheetHTML(m, e) {
  var pt = playerTeam(e), names = playersOf(m, pt);
  var title = e.type === "goal" ? "Gol " + teamName(m, e.team) : e.type === "red" ? "Espulsione" : e.type === "sub" ? "Cambio" : "Ammonizione";
  var icon = e.type === "goal" ? '<span class="ico" style="width:32px;height:32px">' + ballSVG("inline") + "</span>"
    : e.type === "sub" ? '<span class="ico" style="width:32px;height:32px">' + subSVG() + "</span>"
    : '<span class="ico"><i class="card ' + (e.type === "red" ? "r" : "y") + '" style="width:20px;height:28px"></i></span>';
  var h = '<div class="scrim" data-a="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="grab"></div>' +
    '<div class="sh-head">' + icon + "<h3>" + esc(title) + '</h3><span class="bigmin">' + minuteLabel(m, e.period, e.sec) + "</span></div>";
  if (e.type === "goal") {
    h += '<div class="seg">' + [["azione", "Su azione"], ["rigore", "Rigore"], ["autogol", "Autogol"]].map(function (k) {
      return '<button data-a="kind" data-v="' + k[0] + '" aria-pressed="' + (e.kind === k[0]) + '">' + k[1] + "</button>";
    }).join("") + "</div>";
  } else {
    h += '<div class="note">' + esc(teamName(m, e.team)) + "</div>";
  }
  if (e.type === "sub") {
    h += pickerHTML(e, "on", "Entra", names.filter(function (p) { return p !== e.off; }));
    h += pickerHTML(e, "off", "Esce", names.filter(function (p) { return p !== e.on; }));
  } else {
    h += pickerHTML(e, "player", e.kind === "autogol" ? "Autore dell'autogol (" + esc(teamName(m, pt)) + ")" : "Giocatore" + (e.type === "goal" ? " che ha segnato" : ""), names);
  }
  h += '<div class="row" style="justify-content:space-between"><span class="muted small">Minuto</span><div class="stepper">' +
    '<button data-a="ev-min" data-d="-60" aria-label="Un minuto prima">−</button><span class="v tabnum" style="font-size:26px;min-width:84px">' + minuteLabel(m, e.period, e.sec) + '</span><button data-a="ev-min" data-d="60" aria-label="Un minuto dopo">+</button></div></div>';
  h += '<div class="sh-foot"><button class="btn danger" data-a="ev-del">Elimina</button><button class="btn primary" data-a="sheet-close">' + (ui.sheet.fresh ? "Fatto" : "Salva") + "</button></div></div>";
  return h;
}

function ask(title, text, ok, fn, danger) { ui.confirm = { title: title, text: text, ok: ok, fn: fn, danger: danger }; renderLayer(); }
function toast(msg) {
  var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 1800);
}

/* ---------- schermo acceso e segnale di fine tempo ---------- */
var wake = null, actx = null, beeped = false;
function holdWake() { try { if (navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(function (w) { wake = w; w.addEventListener("release", function () { wake = null; }); }).catch(function () {}); } catch (e) {} }
function releaseWake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {} }
function whistle() {
  try {
    if (!actx) return;
    [0, .35, .7].forEach(function (d) {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.value = 2400;
      g.gain.setValueAtTime(.0001, actx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(.18, actx.currentTime + d + .02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d + .28);
      o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + .3);
    });
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
}

/* ---------- cronometro ---------- */
function tick(force) {
  var m = S.match;
  if (ui.view !== "live" || !m) return;
  var clk = document.getElementById("clk");
  if (!clk) return;
  var sec = periodSec(m), len = lenSec(m), base = (m.period - 1) * len;
  var over = sec > len;
  clk.textContent = mmss(base + Math.min(sec, len));
  document.getElementById("extra").textContent = over ? "+" + mmss(sec - len) : "";
  document.getElementById("cd").textContent = mmss(len - sec);
  document.getElementById("cdw").className = "cd" + (sec >= len ? " over" : "");
  var pill = document.getElementById("pill"), pt = document.getElementById("pill-t");
  if (m.status === "break") { pill.className = "pill"; pt.textContent = "Intervallo"; }
  else if (m.run) { pill.className = "pill " + (sec >= len ? "over" : "on"); pt.textContent = sec >= len ? "Recupero" : "In corso"; }
  else { pill.className = "pill"; pt.textContent = m.started ? "In pausa" : "Pronti"; }
  var tg = document.getElementById("toggle");
  if (tg) tg.textContent = m.run ? "❚❚ Pausa" : m.started ? "▶ Riprendi" : "▶ Avvia";
  if (m.run && sec >= len && !m.beeped) { m.beeped = true; save(); whistle(); }
}
setInterval(tick, 250);
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") { tick(); if (S.match && S.match.run) holdWake(); if (liveTarget()) livePush(); }
});

/* ---------- azioni ---------- */
function readForm() {
  var a = document.getElementById("f-team"), b = document.getElementById("f-opp");
  if (a) form.team = a.value;
  if (b) form.opp = b.value;
}
function splitNames(s) { return s.split(/[,;\n]+/).map(function (x) { return x.trim(); }).filter(Boolean); }
function addToRoster(list, name) { if (list.indexOf(name) < 0) list.push(name); }

document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-a]");
  if (!el || el.disabled) return;
  var a = el.getAttribute("data-a"), m = S.match;
  var sm = ui.sheet && findMatch(ui.sheet.mid);
  var se = sm && sm.events.filter(function (x) { return x.id === ui.sheet.eid; })[0];

  switch (a) {
    case "home": ui.view = "home"; render(); window.scrollTo(0, 0); break;
    case "setup": form = null; ui.view = "setup"; render(); break;
    case "resume": ui.view = "live"; render(); break;
    case "roster": ui.view = "roster"; render(); break;
    case "open": ui.view = "summary"; ui.id = el.getAttribute("data-id"); render(); window.scrollTo(0, 0); break;

    case "f-side": readForm(); form.side = el.getAttribute("data-v"); render(); break;
    case "f-per": readForm(); form.periods = Math.min(8, Math.max(1, form.periods + +el.getAttribute("data-d"))); render(); break;
    case "f-min": readForm(); form.minutes = Math.min(90, Math.max(1, form.minutes + +el.getAttribute("data-d"))); render(); break;
    case "f-preset": readForm(); form.minutes = +el.getAttribute("data-v"); render(); break;
    case "start": readForm(); newMatch(form); form = null; ui.view = "live"; render(); window.scrollTo(0, 0); break;

    case "r-add": {
      var inp = document.getElementById("r-new");
      splitNames(inp.value).forEach(function (n) { addToRoster(S.settings.roster, n); });
      save(); render();
      var again = document.getElementById("r-new"); if (again) again.focus();
      break;
    }
    case "r-del": S.settings.roster.splice(+el.getAttribute("data-i"), 1); save(); render(); break;

    case "toggle":
      unlockAudio();
      if (m.run) { stopClock(m); releaseWake(); }
      else { m.run = Date.now(); m.started = true; holdWake(); }
      save(); tick(); break;
    case "adj": {
      var d = +el.getAttribute("data-d") * 1000;
      var cur = m.acc + (m.run ? Date.now() - m.run : 0);
      m.acc += Math.max(-cur, d);
      if (periodSec(m) < lenSec(m)) m.beeped = false;
      save(); tick(); break;
    }
    case "goal": unlockAudio(); addEvent("goal", el.getAttribute("data-t")); break;
    case "card": addEvent(el.getAttribute("data-c"), el.getAttribute("data-t")); break;
    case "end-period": {
      var last = m.period >= m.periods;
      ask(last ? "Fine partita?" : "Fine " + periodName(m.period) + "?",
        last ? "Il cronometro si ferma e vedi il risultato finale con i marcatori." : "Il cronometro si ferma. Riparti quando inizia il " + periodName(m.period + 1) + ".",
        last ? "Chiudi partita" : "Fine tempo",
        function () {
          if (last) return finishMatch();
          stopClock(m); m.status = "break"; releaseWake(); save(); render();
        });
      break;
    }
    case "next-period":
      unlockAudio();
      m.period++; m.acc = 0; m.run = Date.now(); m.status = "play"; m.beeped = false; m.started = true;
      holdWake(); save(); render(); break;
    case "end-match":
      ask("Terminare la partita?", "La partita viene chiusa adesso con il risultato attuale (" + score(m, "home") + "-" + score(m, "away") + ").", "Termina", finishMatch, true);
      break;

    case "edit": ui.sheet = { mid: el.getAttribute("data-mid"), eid: el.getAttribute("data-id"), fresh: false }; ui.newPlayer = {}; renderLayer(); break;
    case "kind": {
      var before = playerTeam(se);
      se.kind = el.getAttribute("data-v");
      if (playerTeam(se) !== before) se.player = "";
      save(); render(); break;
    }
    case "pick": se[el.getAttribute("data-f") || "player"] = el.getAttribute("data-v"); save(); render(); break;
    case "pick-new": {
      var fld = el.getAttribute("data-f") || "player";
      var np = document.getElementById("new-" + fld), name = np.value.trim();
      if (!name) { np.focus(); break; }
      addToRoster(playersOf(sm, playerTeam(se)), name);
      se[fld] = name; ui.newPlayer[fld] = ""; save(); render(); break;
    }
    case "ev-min": se.sec = Math.max(0, se.sec + +el.getAttribute("data-d")); save(); render(); break;
    case "ev-del": {
      var id = se.id;
      sm.events = sm.events.filter(function (x) { return x.id !== id; });
      ui.sheet = null; save(); render(); toast("Evento eliminato"); break;
    }
    case "sheet-close": ui.sheet = null; render(); break;

    case "c-yes": { var fn = ui.confirm.fn; ui.confirm = null; renderLayer(); fn(); break; }
    case "c-no": ui.confirm = null; renderLayer(); break;

    case "copy": copyText(resultText(findMatch(ui.id)), "Risultato copiato"); break;
    case "share": shareText(resultText(findMatch(ui.id)), "Condividi il risultato"); break;
    case "live-on": m.live = { topic: liveTopic() }; save(); render(); break;
    case "live-copy": copyText(liveURL(liveTarget()), "Link copiato"); break;
    case "live-share": {
      var lm = liveTarget();
      shareText("Segui in diretta " + lm.home + " - " + lm.away + ": " + liveURL(lm), "Condividi la diretta");
      break;
    }
    case "share-close": ui.share = null; renderLayer(); break;
    case "del-match":
      ask("Eliminare la partita?", "Il risultato e la cronaca vengono cancellati da questo telefono.", "Elimina", function () {
        S.history = S.history.filter(function (x) { return x.id !== ui.id; }); save(); ui.view = "home"; render();
      }, true);
      break;
  }
});

document.addEventListener("input", function (ev) { if (/^new-/.test(ev.target.id)) ui.newPlayer[ev.target.id.slice(4)] = ev.target.value; });
document.addEventListener("change", function (ev) {
  if (ev.target.id === "r-team") { S.settings.team = ev.target.value.trim(); save(); }
});
document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Enter") return;
  var id = ev.target.id;
  if (id === "r-new") { ev.preventDefault(); document.querySelector('[data-a="r-add"]').click(); }
  if (/^new-/.test(id)) { ev.preventDefault(); document.querySelector('[data-a="pick-new"][data-f="' + id.slice(4) + '"]').click(); }
  if (id === "r-team") ev.target.blur();
});

render();
if (S.match && S.match.run) holdWake();
// Tasto "indietro" di Android: chiude il foglio aperto o torna al menu; 0 = lascia uscire dall'app.
window.bcBack = function () {
  if (ui.confirm || ui.share || ui.sheet) { ui.confirm = null; ui.share = null; ui.sheet = null; render(); return 1; }
  if (ui.view !== "home") { ui.view = "home"; render(); window.scrollTo(0, 0); return 1; }
  return 0;
};
if (liveTarget()) livePush();
window.addEventListener("online", function () { if (liveTarget()) livePush(); });

try {
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor) navigator.serviceWorker.register("sw.js").catch(function () {});
} catch (e) {}
})();
</script>
