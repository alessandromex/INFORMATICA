<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MisterBook Diretta</title>
<meta name="theme-color" content="#0d1912">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Pagina di sola lettura per chi segue la partita: stesso tabellone dell'app, senza comandi. */
:root {
  --bg: #e9efea; --surface: #ffffff; --ink: #0f1a14; --muted: #5a6a61; --line: #d3ddd6; --accent: #13804a;
  --board: #0d1912; --board-ink: #f1f6f2; --board-muted: #8fa597; --led: #ffcf3a;
  --yellow: #f2c200; --red: #d7263d; --danger: #b3192d;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
  --grass-1: #2e8b4f; --grass-2: #287c46; --chalk: rgba(255,255,255,.6);
  --kit: #ffffff; --kit-ink: #0d1912; --kit-gk: #ffcf3a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08100b; --surface: #111c15; --ink: #e7efe9; --muted: #92a398; --line: #233229; --accent: #2fbf71;
    --board: #050a07; --danger: #ff5a6e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08100b; --surface: #111c15; --ink: #e7efe9; --muted: #92a398; --line: #233229; --accent: #2fbf71;
  --board: #050a07; --danger: #ff5a6e; color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--board); }
main {
  max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
}
h1, h2 { font-family: var(--font-display); margin: 0; }
h2 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.brand { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.brand h1 { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
.upd { font-size: 14px; color: var(--muted); text-align: right; }
.upd.err { color: var(--danger); }
.board { background: var(--board); color: var(--board-ink); border-radius: 20px; padding: 16px 14px 18px; display: flex; flex-direction: column; gap: 14px; }
.board-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: 15px; color: var(--board-muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--board-muted); }
.pill.on { color: #5fe39a; }
.pill.on .dot { background: #5fe39a; animation: blink 1.2s infinite; }
.pill.over { color: var(--led); }
.pill.over .dot { background: var(--led); }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.on .dot { animation: none; } }
.clock { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: 1; color: var(--led); font-variant-numeric: tabular-nums; text-align: center; }
.clock small { font-size: 30px; margin-left: 8px; }
.scoreline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.tname { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; text-align: center; line-height: 1.05; overflow-wrap: anywhere; min-width: 0; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.partials { text-align: center; color: var(--board-muted); font-family: var(--font-display); letter-spacing: .06em; font-size: 16px; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.scorers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; }
.scorers > div { min-width: 0; overflow-wrap: anywhere; }
.scorers .r { text-align: right; }
.scorers p { margin: 0 0 4px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.empty { color: var(--muted); }
.tl-period { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: 14px; color: var(--muted); padding: 10px 2px 6px; border-bottom: 1px solid var(--line); }
.ev { display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.side.r { flex-direction: row-reverse; text-align: right; }
.who { font-weight: 600; overflow-wrap: break-word; min-width: 0; }
.who small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }
.min { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.ico { flex: none; width: 22px; height: 22px; display: grid; place-items: center; }
.ico svg { width: 22px; height: 22px; }
.ballsvg .w { fill: var(--surface); }
.ballsvg .k { fill: var(--ink); }
.ballsvg .s, .ballsvg .ring { stroke: var(--ink); }
.card { width: 14px; height: 19px; border-radius: 2px; display: block; }
.card.y { background: var(--yellow); }
.card.r { background: var(--red); }
.card.yr { background: linear-gradient(135deg, var(--yellow) 50%, var(--red) 50%); }
.subsvg .up { stroke: var(--accent); }
.subsvg .down { stroke: var(--danger); }
.who .on, .who .off { display: block; }
.who .on::before, .who .off::before { display: inline-block; width: 1.1em; font-size: .8em; }
.who .on::before { content: "\25B2"; color: var(--accent); }
.who .off::before { content: "\25BC"; color: var(--danger); }
.who .off { font-weight: 500; color: var(--muted); }
/* campo della formazione: stesso aspetto in tema chiaro e scuro */
.pitch {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 68 / 78; border-radius: 12px; overflow: hidden;
  background: repeating-linear-gradient(180deg, var(--grass-1) 0 12.5%, var(--grass-2) 12.5% 25%);
  box-shadow: inset 0 0 0 2px var(--chalk);
}
.pitch.mini { aspect-ratio: 68 / 62; }
.pitch > i { position: absolute; border: 2px solid var(--chalk); }
.pitch .pl-box { left: 22%; right: 22%; bottom: -2px; height: 16%; }
.pitch .pl-six { left: 38%; right: 38%; bottom: -2px; height: 6%; }
.pitch .pl-arc { left: 50%; top: 0; width: 28%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); }
.pp { position: absolute; z-index: 1; transform: translate(-50%, -50%); max-width: 84px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; }
.shirt {
  position: relative; width: 44px; height: 42px; display: grid; place-items: center; padding-top: 6px;
  color: var(--kit-ink); font: 800 17px/1 var(--font-display); font-variant-numeric: tabular-nums;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.4));
}
/* la maglia: sagoma ritagliata, nei colori sociali (tinta unita, strisce, righe o metà e metà) */
.shirt::before { content: ""; position: absolute; inset: 0; background: var(--kit); clip-path: var(--shirt-shape); }
.shirt > b { position: relative; font: inherit; text-shadow: var(--kit-sh, none); }
.pp.gk .shirt::before { background: var(--kit-gk); }
.pp.empty .shirt { width: 40px; height: 40px; padding-top: 0; border-radius: 50%; filter: none; background: rgba(255,255,255,.14); color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.75); font-size: 22px; font-weight: 500; }
.pp.empty .shirt::before { display: none; }
.pp.out .shirt { opacity: .45; }
.pp[aria-pressed=true] .shirt { filter: drop-shadow(0 0 1.5px var(--led)) drop-shadow(0 0 1.5px var(--led)) drop-shadow(0 0 2px var(--led)); }
.pp.empty[aria-pressed=true] .shirt { filter: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.75), 0 0 0 3px var(--led); }
:root { --shirt-shape: polygon(31% 0, 41% 0, 50% 11%, 59% 0, 69% 0, 100% 19%, 88% 43%, 78% 37%, 78% 100%, 22% 100%, 22% 37%, 12% 43%, 0 19%); }
.kit-ico { display: inline-block; width: 22px; height: 21px; background: var(--kit); clip-path: var(--shirt-shape); vertical-align: -3px; margin-right: 6px; }
.pn { max-width: 100%; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.5); color: #fff; font: 700 12px/1.25 var(--font-display); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pn:empty { display: none; }
.bd { position: absolute; top: -5px; left: calc(50% + 11px); display: flex; gap: 2px; align-items: center; }
.bd i { display: block; font-style: normal; }
.b-ball { position: relative; width: 15px; height: 15px; }
.b-ball svg { width: 15px; height: 15px; }
.b-ball b { position: absolute; right: -6px; bottom: -5px; font: 800 11px/1 var(--font-display); color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.b-card { width: 9px; height: 12px; border-radius: 1.5px; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
.b-card.y { background: var(--yellow); }
.b-card.r { background: var(--red); }
.b-card.yr { background: linear-gradient(135deg, var(--yellow) 50%, var(--red) 50%); }
.b-in { color: #5fe39a; font-size: 11px; line-height: 1; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.pitch.mini .shirt { width: 38px; height: 36px; font-size: 15px; padding-top: 5px; }
.pitch .ballsvg .w { fill: #fff; }
.pitch .ballsvg .k { fill: #101512; }
.pitch .ballsvg .s, .pitch .ballsvg .ring { stroke: #101512; }
.bench { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; }
.bench .bp { padding: 3px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.bench .bp small { color: var(--muted); margin-left: 4px; }
.foot { font-size: 13px; color: var(--muted); text-align: center; }
@media (max-width: 380px) { .clock { font-size: 60px; } .score { font-size: 60px; } .tname { font-size: 17px; } }
</style>
</head>
<body>
<main>
  <div class="brand"><h1>MisterBook</h1><span class="upd" id="upd">Collegamento&hellip;</span></div>
  <div id="view"><section class="panel"><div class="empty">Collegamento alla diretta in corso&hellip;</div></section></div>
  <div class="foot">Pagina in sola lettura. Si aggiorna da sola: non serve ricaricare.</div>
</main>
<script>
(function () {
"use strict";
var id = (new URLSearchParams(location.search).get("id") || location.hash.slice(1) || "").replace(/[^A-Za-z0-9_-]/g, "");
var view = document.getElementById("view"), upd = document.getElementById("upd");
var S = null, lastAt = 0, connected = false;
// Lingua di chi guarda: italiano se il telefono è in italiano, altrimenti inglese.
var EN = !/^it\b/i.test(navigator.language || "it");
var DICT = {
  "Collegamento…": "Connecting…", "Collegamento alla diretta in corso…": "Connecting to the live match…",

  "Marcatore non indicato": "Scorer not specified", "Portiere": "Goalkeeper", "Difensore": "Defender", "Centrocampista": "Midfielder", "Attaccante": "Forward",
  "Formazione": "Lineup", "Panchina": "Bench", "Cronaca": "Match log", "Ancora nessun gol, cartellino o cambio.": "No goals, cards or substitutions yet.",
  "Rigore": "Penalty", "Autogol": "Own goal", "Gol": "Goal", "Espulsione": "Red card", "2ª ammonizione, espulso": "Second yellow, sent off", "Ammonizione": "Yellow card",
  "marcatore non indicato": "scorer not specified", "giocatore non indicato": "player not specified", "non indicato": "not specified", "Cambio": "Substitution",
  "giocatori non indicati": "players not specified", "Finale": "Full time", "Terminata": "Finished", "Intervallo": "Break", "Recupero": "Added time", "In diretta": "Live",
  "In pausa": "Paused", "Non ancora iniziata": "Not started yet", "Riconnessione…": "Reconnecting…", "ora": "now", "In attesa di aggiornamenti": "Waiting for updates",
  "In attesa": "Waiting", "Link incompleto": "Incomplete link",
  "La diretta non ha ancora dati. Appena l’allenatore avvia la partita qui compaiono risultato, minuto e marcatori. Se la partita è finita da più di 12 ore il link non è più attivo.":
    "The live page has no data yet. As soon as the coach starts the match, score, minute and scorers appear here. If the match ended more than 12 hours ago the link is no longer active."
};
function T(s) { return EN && DICT[s] ? DICT[s] : s; }
function ord(n) { var k = n % 100; return n + (k >= 11 && k <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th"); }
function perName(n) { return EN ? ord(n) + (S && S.P !== 2 ? " period" : " half") : n + "° tempo"; }
if (EN) {
  document.documentElement.lang = "en"; document.title = "MisterBook Live";
  document.getElementById("upd").textContent = T("Collegamento…");
  document.querySelector("#view .empty").textContent = T("Collegamento alla diretta in corso…");
  document.querySelector(".foot").textContent = T("Pagina in sola lettura. Si aggiorna da sola: non serve ricaricare.");
}

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function two(n) { return (n < 10 ? "0" : "") + n; }
function mmss(sec) { sec = Math.max(0, sec); return two(Math.floor(sec / 60)) + ":" + two(sec % 60); }
function minuteLabel(pe, sec) {
  var len = S.M * 60, base = (pe - 1) * S.M;
  if (sec < len) return (base + Math.floor(sec / 60) + 1) + "′";
  return (base + S.M) + "+" + (Math.floor((sec - len) / 60) + 1) + "′";
}
function name(t) { return t === 0 ? S.h : S.a; }
function score(t, upto) { return S.e.filter(function (e) { return e[0] === "g" && e[1] === t && (!upto || e[2] <= upto); }).length; }
function secondYellow(i) {
  var e = S.e[i];
  if (e[0] !== "y" || !e[4]) return false;
  for (var k = 0; k < i; k++) if (S.e[k][0] === "y" && S.e[k][1] === e[1] && S.e[k][4] === e[4]) return true;
  return false;
}
function periodSec() { return Math.floor((S.p + (S.r ? Math.max(0, Date.now() - S.t) : 0)) / 1000); }
function ball() {
  return '<svg class="ballsvg" viewBox="0 0 40 40" aria-hidden="true"><circle class="w ring" cx="20" cy="20" r="18" stroke-width="2"/>' +
    '<path class="k" d="M20 11.5l7.6 5.5-2.9 9h-9.4l-2.9-9z"/><path class="s" fill="none" stroke-width="2" d="M20 11.5V4M27.6 17l7.2-2.4M24.7 26l4.4 6.2M15.3 26l-4.4 6.2M12.4 17l-7.2-2.4"/>' +
    '<path class="k" d="M20 2.2l4.6 2.3-4.6 2.6-4.6-2.6zM37.6 14.6l-.4 5.4-3.9-2.6.9-4.6zM31.2 34.4l-5.1 1.6 1-4.6 4.7-.9zM8.8 34.4l5.1 1.6-1-4.6-4.7-.9zM2.4 14.6l.4 5.4 3.9-2.6-.9-4.6z"/></svg>';
}
function scorers(t) {
  var groups = [], by = {};
  S.e.forEach(function (e) {
    if (e[0] !== "g" || e[1] !== t) return;
    var n = e[4] || T("Marcatore non indicato");
    if (!by[n]) { by[n] = []; groups.push(n); }
    by[n].push(minuteLabel(e[2], e[3]) + (e[5] === "r" ? (EN ? " (pen.)" : " (rig.)") : e[5] === "o" ? (EN ? " (o.g.)" : " (aut.)") : ""));
  });
  return groups.map(function (n) { return "<p>" + esc(n + " " + by[n].join(", ")) + "</p>"; }).join("");
}

var ballSVG = ball;
// Sul campo, come in TV: cognome e iniziale del nome ("Greco L.", "De Luca P."); un nome solo resta com'è.
function shortName(s) {
  var w = String(s || "").trim().split(/\s+/), k = 1;
  while (k < w.length - 1 && /^(de|di|da|del|della|dello|dal|dalla|lo|la|li|le|van|von|der|den|dos|das|mc|mac|o'|d')$/i.test(w[k - 1]) && k < 3) k++;
  return w.length > k ? w.slice(0, k).join(" ") + " " + w[k].charAt(0).toUpperCase() + "." : w.join(" ");
}
function shirtOf(name) {
  var r = /^(\d{1,3})\s+(.+)$/.exec(name || "");
  if (r) return { n: r[1], s: r[2] };
  var w = String(name || "").trim().split(/\s+/);
  return { n: w.map(function (x) { return x.charAt(0); }).join("").slice(0, 2).toUpperCase(), s: name };
}
// Disegna il campo: righe dal portiere (in basso) agli attaccanti (in alto), come nelle presentazioni TV.
// opt.pick = campo dell'evento da riempire toccando un giocatore; opt.edit = editor della formazione.
function pitchHTML(mod, slots, stats, opt) {
  opt = opt || {};
  var rows = [1].concat(mod.split("-").map(Number)), i = 0;
  var h = '<div class="pitch' + (opt.mini ? " mini" : "") + '"><i class="pl-box"></i><i class="pl-six"></i><i class="pl-arc"></i>';
  rows.forEach(function (n, r) {
    var y = 88 - r * (74 / (rows.length - 1));
    for (var j = 0; j < n; j++, i++) {
      var name = slots[i] || "", s = (stats && name && stats[name]) || {}, sh = shirtOf(name);
      var cls = "pp" + (i === 0 ? " gk" : "") + (name ? "" : " empty") + (s.r ? " out" : "");
      var attr = ' style="left:' + ((j + 1) * 100 / (n + 1)).toFixed(1) + "%;top:" + y.toFixed(1) + "%;width:calc(" + (100 / n).toFixed(1) + '% - 4px)"';
      var b = "";
      if (s.g) b += '<i class="b-ball">' + ballSVG() + (s.g > 1 ? "<b>" + s.g + "</b>" : "") + "</i>";
      if (s.r) b += '<i class="b-card ' + (s.y >= 2 ? "yr" : "r") + '"></i>';
      else if (s.y) b += '<i class="b-card y"></i>';
      if (s.inAt) b += '<i class="b-in">▲</i>';
      var kst = name && i > 0 && opt.kit ? ' style="--kit:' + opt.kit.bg + ";--kit-ink:" + opt.kit.fg + (opt.kit.sh ? ";--kit-sh:0 0 2px #000,0 0 2px #000,0 0 1px #000" : "") + '"' : "";
      var inner = '<span class="shirt"' + kst + "><b>" + (name ? esc(sh.n) : "+") + "</b>" + (b ? '<span class="bd">' + b + "</span>" : "") + "</span>" +
        '<span class="pn">' + esc(name ? shortName(sh.s) : opt.edit ? roleOf(mod, i) : "") + "</span>";
      if (opt.edit) h += '<button class="' + cls + '" data-a="lu-slot" data-i="' + i + '" aria-pressed="' + (opt.sel === i) + '" aria-label="' + esc(roleOf(mod, i) + (name ? ": " + name : "")) + '"' + attr + ">" + inner + "</button>";
      else if (opt.pick && name) h += '<button class="' + cls + '" data-a="pick" data-f="' + opt.pick + '" data-v="' + esc(name) + '" aria-pressed="' + (opt.cur === name) + '"' + attr + ">" + inner + "</button>";
      else h += '<div class="' + cls + '"' + attr + ">" + inner + "</div>";

}
function roleOf(mod, i) {
  if (i === 0) return T("Portiere");
  var lines = mod.split("-").map(Number), k = i - 1;
  for (var l = 0; l < lines.length; l++) {
    if (k < lines[l]) return T(l === 0 ? "Difensore" : l === lines.length - 1 ? "Attaccante" : "Centrocampista");
    k -= lines[l];
  }
  return "";
}
// Formazione attuale: titolari con i cambi applicati, più gol, cartellini e ingressi
// (eventi compatti: [tipo, squadra, tempo, secondi, giocatore o chi esce, tipo di gol, chi entra]).
function fieldState(ti) {
  // S.F = formazioni per squadra (0 = casa, 1 = ospiti); S.f = versione precedente, solo la mia squadra
  var F = S.F ? S.F[ti] : S.f && ti === (S.s === "away" ? 1 : 0) ? S.f : null;
  if (!F || !F.s) return null;
  var cur = F.s.slice(), bench = (F.b || []).slice(), st = {};
  var g = function (n) { return st[n] || (st[n] = { g: 0, y: 0, r: false, inAt: "", outAt: "" }); };
  S.e.forEach(function (e) {
    if (e[0] === "g" && e[1] === ti && e[5] !== "o" && e[4]) g(e[4]).g++;
    if (e[1] !== ti) return;
    if (e[0] === "y" && e[4]) { var y = g(e[4]); y.y++; if (y.y >= 2) y.r = true; }
    if (e[0] === "r" && e[4]) g(e[4]).r = true;
    if (e[0] === "s" && e[4] && e[6]) {
      var k = cur.indexOf(e[4]);
      if (k >= 0) {
        cur[k] = e[6]; g(e[6]).inAt = g(e[4]).outAt = minuteLabel(e[2], e[3]);
        bench = bench.filter(function (n) { return n !== e[6]; });
        if (bench.indexOf(e[4]) < 0) bench.push(e[4]);
      }
    }
  });
  return { mod: F.m, slots: cur, bench: bench, stats: st };
}
// Colori delle maglie mandati dall'app (S.K); il nome della squadra ha accanto la sua maglietta.
function kitOf(ti) { return S.K && S.K[ti] && /^[#(),.%\w -]+$/.test(S.K[ti].bg) && /^#[0-9a-f]{6}$/i.test(S.K[ti].fg) ? S.K[ti] : null; }
function kitIco(ti) { var k = kitOf(ti); return '<span class="kit-ico" style="--kit:' + (k ? k.bg : ti === (S.s === "away" ? 1 : 0) ? "#ffffff" : "#8a8f94") + '"></span>'; }
function lineupHTML(ti) {
  var fs = fieldState(ti);
  if (!fs) return "";
  return '<section class="panel"><h2>' + T("Formazione") + " " + esc(name(ti)) + " \u00b7 " + esc(fs.mod) + "</h2>" + pitchHTML(fs.mod, fs.slots, fs.stats, { kit: kitOf(ti) }) +
    (fs.bench.length ? '<div class="bench"><span class="empty">' + T("Panchina") + "</span>" + fs.bench.map(function (p) {
      var o = fs.stats[p] && fs.stats[p].outAt;
      return '<span class="bp">' + esc(p) + (o ? "<small>\u25BC " + o + "</small>" : "") + "</span>";
    }).join("") + "</div>" : "") + "</section>";
}
function render() {
  if (!S) return;
  var h = '<section class="board"><div class="board-top"><span id="per"></span><span class="pill" id="pill"><i class="dot"></i><span id="pill-t"></span></span></div>';
  if (S.st !== "ended") h += '<div class="clock" id="clk"></div>';
  h += '<div class="scoreline"><span class="tname">' + kitIco(0) + esc(S.h) + '</span><span class="score">' + score(0) + " - " + score(1) + '</span><span class="tname">' + kitIco(1) + esc(S.a) + "</span></div>";
  if (S.P > 1 && (S.pe > 1 || S.st === "ended")) {
    var parts = [];
    for (var p = 1; p <= Math.min(S.pe, S.P); p++) parts.push((EN ? ord(p) + " " : p + "°T ") + score(0, p) + "-" + score(1, p));
    h += '<div class="partials">' + parts.join(" · ") + "</div>";
  }
  var sh = scorers(0), sa = scorers(1);
  if (sh || sa) h += '<div class="scorers"><div>' + sh + '</div><div class="r">' + sa + "</div></div>";
  h += "</section>";

  h += lineupHTML(0) + lineupHTML(1);
  h += '<section class="panel"><h2>' + T("Cronaca") + "</h2>";
  if (!S.e.length) h += '<div class="empty">' + T("Ancora nessun gol, cartellino o cambio.") + "</div>";
  var cur = 0;
  S.e.forEach(function (e, i) {
    if (e[2] !== cur) { cur = e[2]; if (S.P > 1) h += '<div class="tl-period">' + perName(cur) + "</div>"; }
    var icon, sub;
    if (e[0] === "g") { icon = ball(); sub = T(e[5] === "r" ? "Rigore" : e[5] === "o" ? "Autogol" : "Gol"); }
    else if (e[0] === "r") { icon = '<i class="card r"></i>'; sub = T("Espulsione"); }
    else { var dy = secondYellow(i); icon = '<i class="card ' + (dy ? "yr" : "y") + '"></i>'; sub = T(dy ? "2ª ammonizione, espulso" : "Ammonizione"); }
    var who = e[4] ? esc(e[4]) + "<small>" + sub + "</small>" : sub + "<small>" + T(e[0] === "g" ? "marcatore non indicato" : "giocatore non indicato") + "</small>";
    if (e[0] === "s") {
      // cambio: [4] = chi esce, [6] = chi entra
      icon = '<svg class="subsvg" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="up" d="M8 20V5M3.5 9.5L8 5l4.5 4.5"/><path class="down" d="M16 4v15M11.5 14.5L16 19l4.5-4.5"/></svg>';
      who = e[4] || e[6] ? '<span class="on">' + esc(e[6] || T("non indicato")) + '</span><span class="off">' + esc(e[4] || T("non indicato")) + "</span>" : T("Cambio") + "<small>" + T("giocatori non indicati") + "</small>";
    }
    var side = '<span class="side' + (e[1] === 1 ? " r" : "") + '"><span class="ico">' + icon + '</span><span class="who">' + who + "</span></span>";
    h += '<div class="ev">' + (e[1] === 0 ? side : "<span></span>") + '<span class="min">' + minuteLabel(e[2], e[3]) + "</span>" + (e[1] === 1 ? side : "<span></span>") + "</div>";
  });
  h += "</section>";
  view.innerHTML = h;
  document.title = S.h + " " + score(0) + "-" + score(1) + " " + S.a;
  tick();
}

function tick() {
  if (!S) return;
  var per = document.getElementById("per"), pill = document.getElementById("pill"), pt = document.getElementById("pill-t"), clk = document.getElementById("clk");
  if (!per) return;
  var sec = periodSec(), len = S.M * 60, base = (S.pe - 1) * len;
  if (clk) clk.innerHTML = mmss(base + Math.min(sec, len)) + (sec > len ? "<small>+" + mmss(sec - len) + "</small>" : "");
  if (S.st === "ended") { per.textContent = T("Finale"); pill.className = "pill"; pt.textContent = T("Terminata"); }
  else if (S.st === "break") { per.textContent = (EN ? "End of " : "Fine ") + perName(S.pe); pill.className = "pill"; pt.textContent = T("Intervallo"); }
  else {
    per.textContent = perName(S.pe);
    if (S.r) { pill.className = "pill " + (sec >= len ? "over" : "on"); pt.textContent = T(sec >= len ? "Recupero" : "In diretta"); }
    else { pill.className = "pill"; pt.textContent = T(S.sd ? "In pausa" : "Non ancora iniziata"); }
  }
  var ago = lastAt ? Math.round((Date.now() - lastAt) / 60000) : null;
  if (!connected) { upd.className = "upd err"; upd.textContent = T("Riconnessione…"); }
  else if (!lastAt) { upd.className = "upd"; upd.textContent = T("In attesa di aggiornamenti"); }
  else if (EN) { upd.className = "upd"; upd.textContent = "Updated " + (ago < 1 ? "just now" : ago === 1 ? "1 minute ago" : ago + " minutes ago"); }
  else { upd.className = "upd"; upd.textContent = "Aggiornata " + (ago < 1 ? "ora" : ago === 1 ? "1 minuto fa" : ago + " minuti fa"); }
}

function accept(data) {
  try {
    var s = typeof data === "string" ? JSON.parse(data) : data;
    if (!s || s.v !== 1 || !Array.isArray(s.e)) return;
    if (S && s.t < S.t) return;
    S = s; lastAt = s.t; render();
  } catch (e) {}
}
function onMessage(m) {
  if (!m || m.event !== "message") return;
  if (m.attachment && m.attachment.url) fetch(m.attachment.url).then(function (r) { return r.text(); }).then(accept).catch(function () {});
  else accept(m.message);
}
function waiting() {
  if (S) return;
  view.innerHTML = '<section class="panel"><h2>' + T("In attesa") + '</h2><div class="empty">' + T("La diretta non ha ancora dati. Appena l’allenatore avvia la partita qui compaiono risultato, minuto e marcatori. Se la partita è finita da più di 12 ore il link non è più attivo.") + "</div></section>";
}

if (!id) {
  view.innerHTML = EN ? '<section class="panel"><h2>Incomplete link</h2><div class="empty">Open the full link you were sent: it must end with <b>?id=</b> followed by a code.</div></section>'
    : '<section class="panel"><h2>Link incompleto</h2><div class="empty">Apri il link completo che ti è stato mandato: deve finire con <b>?id=</b> seguito da un codice.</div></section>';
  upd.textContent = "";
  return;
}

var url = "https://ntfy.sh/" + encodeURIComponent(id);
if (window.EventSource) {
  var es = new EventSource(url + "/sse?since=all");
  es.addEventListener("open", function () { connected = true; tick(); setTimeout(waiting, 2500); });
  es.onmessage = function (ev) { connected = true; try { onMessage(JSON.parse(ev.data)); } catch (e) {} };
  es.onerror = function () { connected = false; tick(); };
} else {
  var poll = function () {
    fetch(url + "/json?poll=1&since=all").then(function (r) { return r.text(); }).then(function (t) {
      connected = true;
      t.split("\n").forEach(function (line) { if (line) try { onMessage(JSON.parse(line)); } catch (e) {} });
      waiting(); tick();
    }).catch(function () { connected = false; tick(); });
  };
  poll(); setInterval(poll, 10000);
}
setInterval(tick, 500);
})();
</script>
</body>
</html>
